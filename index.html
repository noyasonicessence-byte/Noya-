<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>诺雅 · 七维教学工作台</title>
<style id="mainstyle">
  :root{
    --bg:#17130d; --panel:#221c14; --panel-2:#1b1610; --line:#3a3024;
    --ink:#e9e0cf; --ink-dim:#a99f8c; --accent:#d9a441; --accent-soft:#b98a34;
    --card:#efe9dc; --card-ink:#2a2320;
    --c-arc:#c8563d; --c-weak:#3f8f43; --c-strike:#b1a897; --c-ins:#3f78c9; --c-flap:#d2452f; --c-beat:#d9a441; --c-pause:#8a7f6a; --c-mut:#9b5bd6;
    --serif:"Georgia","Times New Roman","Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
    --sans:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    /* dimension colors */
    --d-sound:#d9a441; --d-thinking:#c8563d; --d-mapping:#3f8f43; --d-resonance:#3f78c9; --d-visual:#b07bd0; --d-cinematic:#d08a3f; --d-flow:#4bb0a6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  button{font-family:var(--sans);cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#2c251a;color:var(--ink);font-size:13px;padding:7px 13px;transition:.14s}
  button:hover{border-color:var(--accent-soft)}
  button.primary{background:var(--accent);color:#241a06;font-weight:600;border-color:transparent}
  button.primary:hover{background:#e6b556}
  button.ghost{background:transparent}
  textarea,input[type=text]{width:100%;background:#0f0c08;border:1px solid var(--line);border-radius:9px;color:var(--ink);
    font-family:var(--serif);font-size:15px;line-height:1.65;padding:10px 12px;resize:vertical}
  textarea:focus,input:focus{outline:none;border-color:var(--accent-soft)}
  label.fl{display:block;font-size:11.5px;color:var(--ink-dim);letter-spacing:.05em;margin:0 0 5px 2px}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel-2);flex:0 0 auto}
  .brand .cn{font-size:13px;letter-spacing:.24em;color:var(--ink-dim)}
  .brand .en{font-family:var(--serif);font-style:italic;font-size:17px;margin-top:1px}
  header .titlewrap{flex:1;min-width:0;max-width:520px}
  header input#title{font-size:15px;padding:8px 12px}
  header .sp{flex:1}
  header .hbtn{font-size:12.5px}

  /* ---------- source input drawer ---------- */
  #source{border-bottom:1px solid var(--line);background:var(--panel-2);padding:14px 18px;display:none;flex:0 0 auto}
  body.editing #source{display:block}
  #source .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){#source .grid{grid-template-columns:1fr}}
  #source .row{display:flex;gap:10px;margin-top:12px;align-items:center}

  /* ---------- 3-column main ---------- */
  main{flex:1;display:flex;min-height:0}
  .col{min-height:0;overflow:auto}
  .col-list{flex:0 0 288px;border-right:1px solid var(--line);background:var(--panel-2);padding:10px}
  .col-stage{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:40px 34px;gap:26px}
  .col-teach{flex:0 0 400px;border-left:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column}
  @media(max-width:1120px){.col-teach{flex-basis:340px}.col-list{flex-basis:240px}}

  /* left: sentence list */
  .lst-hd{font-size:11.5px;color:var(--ink-dim);letter-spacing:.08em;margin:4px 6px 10px}
  .srow{border:1px solid transparent;border-radius:10px;padding:10px 11px;margin-bottom:7px;cursor:pointer;transition:.12s}
  .srow:hover{background:#2a231a}
  .srow.on{background:#2c2419;border-color:var(--accent-soft)}
  .srow .num{font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .srow .txt{font-family:var(--serif);font-size:15px;margin-top:2px;line-height:1.4;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .srow .zh{font-family:var(--serif);font-size:12px;color:var(--ink-dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dots{display:flex;gap:5px;margin-top:8px}
  .dot{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--dc);background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--dc);opacity:.42;transition:.12s;padding:0}
  .dot.lit{background:var(--dc);opacity:1;border-color:transparent}
  .dot:hover{opacity:.9}

  /* middle: stage */
  .stage-empty{color:#9c9384;font-family:var(--serif);font-size:17px;text-align:center;margin-top:16vh;line-height:1.9}
  #stageLine{position:relative;font-family:var(--serif);width:100%;max-width:900px;padding:2em 0 1.1em}
  #stageLine .en{font-size:40px;line-height:1.7;letter-spacing:.01em;position:relative}
  #stageZh{font-family:var(--serif);font-size:19px;color:#8f8676;max-width:900px;width:100%;line-height:1.6}
  .word{position:relative;display:inline-block}
  .cell{display:inline-block;position:relative;cursor:default;padding:0 .5px;border-radius:3px}
  body.sound .cell.letter{cursor:pointer}
  body.sound .cell.letter:hover{color:var(--accent-soft)}
  .cell.space{width:.32em}
  .cell.pending{background:rgba(217,164,65,.35)}
  .cell.strike{color:var(--c-strike)}
  .cell.strike::after{content:"";position:absolute;left:-1px;right:-1px;top:52%;height:2px;background:var(--c-strike);transform:rotate(-18deg);border-radius:2px}
  .cell.weak{color:var(--c-weak)}
  .cell.flap{color:var(--c-flap)}
  .cell.mut{color:var(--c-mut)}
  /* per-letter sound labels sit BELOW the letter (arcs live above → no overlap) */
  .belowmark{position:absolute;left:50%;transform:translateX(-50%);top:100%;margin-top:.1em;font-family:var(--serif);font-size:.42em;white-space:nowrap;line-height:1;pointer-events:none}
  .mutlabel{color:var(--c-mut);font-style:italic}
  .flapmark{color:var(--c-flap)}
  .ins{display:inline-block;color:var(--c-ins);font-size:.6em;vertical-align:.5em;font-style:italic;font-family:var(--serif);margin:0 .02em;cursor:pointer}
  .pause{display:inline-block;color:var(--c-pause);margin:0 .06em;font-weight:300;cursor:pointer}
  .beat{position:absolute;left:50%;transform:translateX(-50%);bottom:100%;margin-bottom:.32em;width:.22em;height:.22em;border-radius:50%;background:var(--c-beat)}
  .wnote-cn{position:absolute;left:50%;transform:translateX(-50%);bottom:100%;margin-bottom:1.15em;font-family:var(--serif);font-size:.4em;color:#6f665a;white-space:nowrap;line-height:1;pointer-events:none}
  .wnote-ipa{position:absolute;left:50%;transform:translateX(-50%);top:100%;margin-top:.12em;font-family:var(--serif);font-size:.42em;color:#7c7566;white-space:nowrap;line-height:1;pointer-events:none}
  svg.arclayer{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .arcpath{fill:none;stroke:var(--c-arc);stroke-width:2.2;stroke-linecap:round}
  #stageCard{background:var(--card);color:var(--card-ink);border-radius:16px;padding:44px 48px 40px;width:100%;max-width:960px;
    display:flex;flex-direction:column;align-items:flex-start;gap:22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .stage-hint{font-size:12.5px;color:#a99f8c;font-family:var(--sans)}

  /* right: teach panel */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
  .tab{position:relative;font-size:12.5px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink-dim);white-space:nowrap}
  .tab .en{font-family:var(--serif);font-style:italic;font-size:10px;opacity:.7;margin-left:3px}
  .tab.on{color:#241a06;background:var(--dc,var(--accent));border-color:transparent;font-weight:600}
  .tab .hasc{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--dc,var(--accent))}
  .tab.on .hasc{background:#241a06}
  .teach-body{flex:1;overflow:auto;padding:16px}
  .teach-empty{color:#8a8272;font-size:14px;text-align:center;margin-top:20vh;font-family:var(--serif);line-height:1.9}
  .dim-title{font-size:14px;color:var(--ink);margin:0 0 3px}
  .dim-sub{font-size:12px;color:var(--ink-dim);margin:0 0 14px;line-height:1.6}
  .field{margin-bottom:14px}
  .map-row{display:flex;align-items:stretch;gap:8px;margin-bottom:9px}
  .map-row .cols{flex:1;display:flex;flex-direction:column;gap:5px}
  .map-row .updown{display:flex;align-items:center;color:var(--ink-dim);font-size:16px}
  .map-row input{font-size:14px;padding:8px 10px}
  .map-row .del{flex:0 0 auto;align-self:center;padding:5px 9px;font-size:12px}
  .addbtn{font-size:12.5px;padding:6px 12px}
  .flow-prev{margin-top:8px;font-family:var(--serif);font-size:15px;color:var(--accent);line-height:1.7;word-break:break-word}
  .toolgrid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:64px;height:52px;border-radius:10px;
    border:1px solid var(--line);background:#2c251a;color:var(--ink);cursor:pointer}
  .tbtn small{font-size:10px;color:var(--ink-dim)}
  .tbtn .ic{font-family:var(--serif);font-size:17px;line-height:1}
  .tbtn.on{background:var(--accent);border-color:transparent}
  .tbtn.on small,.tbtn.on .ic{color:#241a06}
  .legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-dim);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
  .lg{display:flex;align-items:center;gap:8px}
  .lg b{color:var(--ink);font-weight:600}
  .sw{width:22px;height:16px;border-radius:4px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:12px;flex:0 0 auto}

  /* note editor popover */
  #noteEditor{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;width:236px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  #noteEditor[hidden]{display:none}
  .ne-row{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
  .ne-row input{font-size:15px;padding:7px 9px}
  .ne-btns{display:flex;gap:7px}
  .ne-btns button{padding:6px 12px;font-size:12px}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;background:rgba(34,28,20,.96);color:var(--ink);
    border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #toast.show{opacity:1}

  /* ---------- export dialog + preview ---------- */
  .modal{position:fixed;inset:0;z-index:90;background:rgba(10,8,6,.78);display:flex;align-items:center;justify-content:center;padding:24px}
  .modal[hidden]{display:none}
  .dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:380px;max-width:92vw}
  .dlg h3{margin:0 0 14px;font-size:15px;font-weight:600}
  .dlg .fl{margin-top:2px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:14px}
  .seg button{border:none;border-radius:0;background:transparent;padding:7px 14px;font-size:12.5px}
  .seg button.on{background:var(--accent);color:#241a06;font-weight:600}
  .dlg .acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  #previewModal img{max-width:92vw;max-height:74vh;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.6);background:#fff}
  #previewModal{flex-direction:column;gap:14px}
  .pv-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
  .pv-bar a.dl{background:var(--accent);color:#241a06;font-weight:600;border:none;border-radius:999px;padding:9px 20px;font-size:14px;text-decoration:none;font-family:var(--sans)}
  .pv-hint{color:#c9bfa8;font-size:12.5px}

  /* teaching sheet (used by image export + print) */
  .sheet{background:var(--card);color:var(--card-ink);padding:46px 52px;width:960px;font-family:var(--serif);display:flex;flex-direction:column;gap:30px}
  .sheet-title{font-size:34px;text-align:center;text-wrap:balance;margin-bottom:6px}
  .sheet-block{display:flex;flex-direction:column;gap:10px;padding-bottom:26px;border-bottom:1px solid #e0d8c6}
  .sheet-block:last-child{border-bottom:none}
  .sheet-num{font-family:var(--sans);font-size:12px;color:#a99a80;letter-spacing:.08em}
  .sheet-en{font-size:34px;line-height:1.7;position:relative;padding:1.4em 0 .9em}
  .sheet-en .en{position:relative;display:block}
  .sheet-zh{font-size:17px;color:#6f665a}
  .sheet-dims{display:flex;flex-direction:column;gap:7px;margin-top:6px;border-left:3px solid var(--accent);padding-left:14px}
  .sheet-dim{font-size:14.5px;line-height:1.7;color:#4a4234;font-family:var(--sans)}
  .sheet-dim b{font-family:var(--sans);color:#7a5a12;font-weight:700;margin-right:6px}

  #printArea{display:none}
  @media print{
    header,#source,main,.modal,#toast,#noteEditor,#mutEditor{display:none!important}
    html,body{height:auto;overflow:visible;background:#fff}
    #printArea{display:block!important}
    .sheet{width:auto;box-shadow:none}
    .sheet-block{break-inside:avoid;page-break-inside:avoid}
  }
</style>

<header>
  <div class="brand"><div class="cn">诺雅 · 七维教学</div><div class="en">Expression Studio</div></div>
  <div class="titlewrap"><input id="title" type="text" placeholder="标题（歌名 / 台词出处 / 文章名…）"></div>
  <button class="hbtn ghost" id="editSrc">原文 / 编辑</button>
  <div class="sp"></div>
  <button class="hbtn primary" id="expBtn">导出</button>
  <button class="hbtn ghost filebtn" id="impBtn" style="position:relative;overflow:hidden">导入<input id="impFile" type="file" accept="application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer"></button>
</header>

<section id="source">
  <div class="grid">
    <div><label class="fl">英文原文（每行一句）</label><textarea id="en" rows="5" placeholder="逐句粘贴英文…"></textarea></div>
    <div><label class="fl">中文参考（可选，与英文按行对应）</label><textarea id="zh" rows="5" placeholder="逐句粘贴中文参考…"></textarea></div>
  </div>
  <div class="row">
    <button class="primary" id="gen">生成逐句</button>
    <button class="ghost" id="closeSrc">收起</button>
    <span class="fl" style="margin:0">生成后可在左侧逐句选择，右侧完成七维教学设计。</span>
  </div>
</section>

<main>
  <div class="col col-list" id="list"></div>
  <div class="col col-stage" id="stage"><div class="stage-empty">在上方「原文 / 编辑」粘贴英文原文<br>点「生成逐句」开始逐句教学设计</div></div>
  <div class="col-teach">
    <div class="tabs" id="tabs"></div>
    <div class="teach-body" id="teach"><div class="teach-empty">选择左侧任意一句<br>开始七维教学设计</div></div>
  </div>
</main>

<div id="noteEditor" hidden>
  <div class="ne-row"><label class="fl">词上 · 中文（如：抱在怀里）</label><input id="neCn" type="text"></div>
  <div class="ne-row"><label class="fl">词下 · 音标（如：/jər/）</label><input id="neIpa" type="text"></div>
  <div class="ne-btns"><button class="primary" id="neSave">保存</button><button id="neClear">清除</button><button class="ghost" id="neCancel">取消</button></div>
</div>
<div id="mutEditor" hidden>
  <div class="ne-row"><label class="fl">变成的音（自己填，如 ch / tʃ / j）</label><input id="mutIn" type="text"></div>
  <div class="ne-btns"><button class="primary" id="mutSave">保存</button><button id="mutClear">清除</button><button class="ghost" id="mutCancel">取消</button></div>
</div>
<div id="toast"></div>

<div id="exportModal" class="modal" hidden>
  <div class="dlg">
    <h3>导出</h3>
    <div class="fl">范围</div>
    <span class="seg" id="scopeSeg"><button data-s="current" class="on">本句</button><button data-s="all">全部</button></span>
    <div class="fl">内容</div>
    <span class="seg" id="contentSeg"><button data-c="sound" class="on">仅发音标注</button><button data-c="full">标注 + 七维</button></span>
    <div class="acts">
      <button class="primary" id="doImg">导出图片</button>
      <button id="doPrint">打印 / 存 PDF</button>
      <button class="ghost" id="doJson">导出 JSON</button>
      <button class="ghost" id="expClose">取消</button>
    </div>
    <div class="fl" style="margin-top:12px;line-height:1.6">图片会在页面内弹出预览，可下载或长按/右键保存。「打印」用浏览器的"存为 PDF"。</div>
  </div>
</div>

<div id="previewModal" class="modal" hidden>
  <img id="pvImg" alt="导出预览">
  <div class="pv-bar">
    <a class="dl" id="pvDownload" download>下载图片</a>
    <button class="ghost" id="pvClose">关闭</button>
    <span class="pv-hint">若没自动下载：右键 / 长按图片即可保存</span>
  </div>
</div>

<div id="printArea"></div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var titleEl=$('title'), enBox=$('en'), zhBox=$('zh');
  var listEl=$('list'), stageEl=$('stage'), tabsEl=$('tabs'), teachEl=$('teach');

  var DIMS=[
    {k:'sound',    cn:'语感',    en:'Sound'},
    {k:'thinking', cn:'思维',    en:'Thinking'},
    {k:'mapping',  cn:'双语映射', en:'Mapping'},
    {k:'resonance',cn:'实时共振', en:'Resonance'},
    {k:'visual',   cn:'画面觉醒', en:'Visual'},
    {k:'cinematic',cn:'电影记忆', en:'Cinematic'},
    {k:'flow',     cn:'Flow',    en:'Flow'}
  ];
  var DC={sound:'var(--d-sound)',thinking:'var(--d-thinking)',mapping:'var(--d-mapping)',resonance:'var(--d-resonance)',visual:'var(--d-visual)',cinematic:'var(--d-cinematic)',flow:'var(--d-flow)'};

  var lines=[], sel=-1, activeDim='sound', tool='arc', pendingArc=null, history=[];

  // ---------- model ----------
  function replacer(k,v){ return v instanceof Set ? {__set:Array.from(v)} : v; }
  function reviver(k,v){ return (v && v.__set) ? new Set(v.__set) : v; }
  function newTeach(){ return {thinking:'',mapping:[],resonance:'',visual:'',cinematic:{characters:'',scene:'',cause:'',moment:'',aftermath:'',source:''},flow:''}; }
  function computeWords(line){ var w=[],cur=null; line.cells.forEach(function(c,i){ if(c.isLetter){ if(!cur){cur={cells:[]};w.push(cur);} cur.cells.push(i);} else cur=null; }); return w; }
  function makeLine(text,zh){
    var cells=[]; for(var i=0;i<text.length;i++) cells.push({ch:text[i],isLetter:/\S/.test(text[i])});
    var l={cells:cells,zh:(zh||'').trim(),strike:new Set(),weak:new Set(),flap:new Set(),beats:new Set(),pauses:new Set(),arcs:[],ins:[],notes:{},mut:{},dims:new Set(),teach:newTeach()};
    l.words=computeWords(l); return l;
  }
  function reviveLine(l){
    l.strike=new Set(l.strike||[]); l.weak=new Set(l.weak||[]); l.flap=new Set(l.flap||[]); l.beats=new Set(l.beats||[]); l.pauses=new Set(l.pauses||[]);
    l.dims=new Set(l.dims||[]); if(!l.arcs)l.arcs=[]; if(!l.ins)l.ins=[]; if(!l.notes)l.notes={}; if(!l.mut)l.mut={}; if(!l.teach)l.teach=newTeach();
    if(!l.words)l.words=computeWords(l); return l;
  }

  function build(){
    var en=enBox.value.replace(/\r/g,'').split('\n'), zh=zhBox.value.replace(/\r/g,'').split('\n');
    while(en.length>1 && en[en.length-1].trim()==='') en.pop();
    // Preserve annotations/teaching for lines whose English text is unchanged; only new/changed lines are fresh.
    var pool={}; lines.forEach(function(l){ var t=lineText(l); (pool[t]=pool[t]||[]).push(l); });
    var kept=0;
    lines=en.map(function(t,i){
      var arr=pool[t];
      if(arr && arr.length){ var o=arr.shift(); o.zh=(zh[i]||'').trim(); kept++; return o; }
      return makeLine(t, zh[i]||'');
    });
    sel = lines.length? Math.min(sel<0?0:sel, lines.length-1) : -1;
    history=[]; pendingArc=null;
    document.body.classList.remove('editing');
    renderAll(); save();
    toast('已生成 '+lines.length+' 句'+(kept?(' · 保留了 '+kept+' 句已做内容'):''));
  }

  // ---------- content checks (for dots/tab markers) ----------
  function soundHas(l){ return l.strike.size||l.weak.size||l.flap.size||l.beats.size||l.pauses.size||l.arcs.length||l.ins.length||Object.keys(l.notes).length||Object.keys(l.mut||{}).length; }
  function dimHas(l,k){
    var t=l.teach;
    if(k==='sound') return !!soundHas(l);
    if(k==='thinking') return !!t.thinking.trim();
    if(k==='mapping') return t.mapping.some(function(m){return (m.en||'').trim()||(m.zh||'').trim();});
    if(k==='resonance') return !!t.resonance.trim();
    if(k==='visual') return !!t.visual.trim();
    if(k==='cinematic'){ var c=t.cinematic; return !!(c.characters.trim()||c.scene.trim()||c.cause.trim()||c.moment.trim()||c.aftermath.trim()); }
    if(k==='flow') return !!t.flow.trim();
    return false;
  }
  function dimLit(l,k){ return l.dims.has(k) || dimHas(l,k); }
  function hasAnyContent(l){ return DIMS.some(function(d){return dimHas(l,d.k);}); }

  // ---------- left list ----------
  function lineText(l){ return l.cells.map(function(c){return c.ch;}).join(''); }
  function renderList(){
    listEl.innerHTML='';
    if(!lines.length){ listEl.innerHTML='<div class="lst-hd">还没有句子</div>'; return; }
    var hd=document.createElement('div'); hd.className='lst-hd'; hd.textContent='逐句 · '+lines.length+' 句'; listEl.appendChild(hd);
    lines.forEach(function(l,i){
      var row=document.createElement('div'); row.className='srow'+(i===sel?' on':'');
      row.addEventListener('click',function(e){ if(e.target.closest('.dot')) return; selectLine(i); });
      var num=document.createElement('div'); num.className='num'; num.textContent=(i+1<10?'0':'')+(i+1); row.appendChild(num);
      var tx=document.createElement('div'); tx.className='txt'; tx.textContent=lineText(l)||'（空行）'; row.appendChild(tx);
      if(l.zh){ var zh=document.createElement('div'); zh.className='zh'; zh.textContent=l.zh; row.appendChild(zh); }
      var dots=document.createElement('div'); dots.className='dots';
      DIMS.forEach(function(d){
        var dot=document.createElement('button'); dot.className='dot'+(dimLit(l,d.k)?' lit':''); dot.style.setProperty('--dc',DC[d.k]);
        dot.title=d.cn+' '+d.en; dot.textContent=d.cn.charAt(0);
        dot.addEventListener('click',function(ev){ ev.stopPropagation(); toggleDim(i,d.k); });
        dots.appendChild(dot);
      });
      row.appendChild(dots);
      listEl.appendChild(row);
    });
  }
  function toggleDim(i,k){
    var l=lines[i];
    if(l.dims.has(k)) { if(!dimHas(l,k)) l.dims.delete(k); }  // can't turn off if it has content
    else l.dims.add(k);
    if(sel!==i) selectLine(i);
    activeDim=k; renderList(); renderTabs(); renderTeach(); save();
  }

  function selectLine(i){ sel=i; pendingArc=null; renderList(); renderStage(); renderTabs(); renderTeach(); }

  // ---------- middle stage (语感 canvas) ----------
  function buildLineEl(l){
    var en=document.createElement('div'); en.className='en';
    var c2w={}; l.words.forEach(function(w,wi){ w.cells.forEach(function(ci){c2w[ci]=wi;}); });
    var curWord=null,curWi=-1;
    l.cells.forEach(function(cell,ci){
      if(cell.isLetter){
        var wi=c2w[ci];
        if(wi!==curWi){
          curWord=document.createElement('span'); curWord.className='word'; curWord.dataset.w=wi;
          en.appendChild(curWord); curWi=wi;
          // beat + notes anchored to word
          if(l.beats.has(wi)){ var b=document.createElement('span'); b.className='beat'; curWord.appendChild(b); }
          var nt=l.notes[wi];
          if(nt){ if(nt.cn){var cn=document.createElement('span');cn.className='wnote-cn';cn.textContent=nt.cn;curWord.appendChild(cn);}
                  if(nt.ipa){var ip=document.createElement('span');ip.className='wnote-ipa';ip.textContent=nt.ipa;curWord.appendChild(ip);} }
        }
        var ls=document.createElement('span'); ls.className='cell letter';
        if(l.strike.has(ci))ls.className+=' strike'; if(l.weak.has(ci))ls.className+=' weak'; if(l.flap.has(ci))ls.className+=' flap';
        if(l.mut&&l.mut[ci]!=null)ls.className+=' mut';
        if(pendingArc===ci)ls.className+=' pending';
        ls.textContent=cell.ch; ls.dataset.cell=ci; ls.dataset.word=wi; ls.addEventListener('click',onCellClick);
        if(l.flap.has(ci)){ var fd=document.createElement('span'); fd.className='belowmark flapmark'; fd.textContent='ɾ'; ls.appendChild(fd); }
        if(l.mut&&l.mut[ci]!=null){ var ml=document.createElement('span'); ml.className='belowmark mutlabel'; ml.textContent=l.mut[ci]; ls.appendChild(ml); }
        curWord.appendChild(ls);
        l.ins.forEach(function(x){ if(x.after===ci){ var g=document.createElement('span'); g.className='ins'; g.textContent=x.g;
          g.title='点击删除加音'; g.addEventListener('click',function(e){ e.stopPropagation(); snapshot(); l.ins=l.ins.filter(function(y){return !(y.after===x.after&&y.g===x.g);}); renderStage(); saveDots(); }); curWord.appendChild(g); } });
        // pause after last cell of a word
        if(ci===l.words[wi].cells[l.words[wi].cells.length-1] && l.pauses.has(wi)){
          var pa=document.createElement('span'); pa.className='pause'; pa.textContent='│'; pa.title='点击删除停顿';
          pa.addEventListener('click',function(e){ e.stopPropagation(); snapshot(); l.pauses.delete(wi); renderStage(); saveDots(); });
          en.appendChild(pa);
        }
      }else{
        curWi=-1; curWord=null;
        var sp=document.createElement('span'); sp.className='cell space'; sp.innerHTML = cell.ch===' '?'&nbsp;':cell.ch; en.appendChild(sp);
      }
    });
    var svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','arclayer'); en.appendChild(svg);
    return {el:en,svg:svg};
  }
  function drawArcs(en,svg,l){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var base=en.getBoundingClientRect();
    l.arcs.forEach(function(a){
      var A=en.querySelector('.cell[data-cell="'+a[0]+'"]'),B=en.querySelector('.cell[data-cell="'+a[1]+'"]'); if(!A||!B)return;
      var ra=A.getBoundingClientRect(),rb=B.getBoundingClientRect();
      var x1=ra.left+ra.width/2-base.left,x2=rb.left+rb.width/2-base.left;
      var yTop=Math.min(ra.top,rb.top)-base.top,span=Math.abs(x2-x1),lift=Math.min(26,12+span*0.1),y=yTop-4,cx=(x1+x2)/2,cy=y-lift;
      var p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('class','arcpath');
      p.setAttribute('d','M '+x1+' '+y+' Q '+cx+' '+cy+' '+x2+' '+y); svg.appendChild(p);
    });
  }
  function renderStage(){
    stageEl.innerHTML='';
    if(sel<0||!lines[sel]){ stageEl.innerHTML='<div class="stage-empty">选择左侧任意一句开始</div>'; return; }
    var l=lines[sel];
    var card=document.createElement('div'); card.id='stageCard';
    var wrap=document.createElement('div'); wrap.id='stageLine';
    var built=buildLineEl(l); wrap.appendChild(built.el); card.appendChild(wrap);
    if(l.zh){ var zh=document.createElement('div'); zh.id='stageZh'; zh.textContent=l.zh; card.appendChild(zh); }
    var hint=document.createElement('div'); hint.className='stage-hint';
    hint.textContent = activeDim==='sound' ? '语感模式：在右侧选工具，点这里的字母进行标注' : '当前在「'+dimCn(activeDim)+'」维度 · 切到右侧「语感」可标注发音';
    card.appendChild(hint);
    stageEl.appendChild(card);
    requestAnimationFrame(function(){ drawArcs(built.el,built.svg,l); });
  }
  function dimCn(k){ for(var i=0;i<DIMS.length;i++) if(DIMS[i].k===k) return DIMS[i].cn; return k; }

  // ---------- 语感 tools ----------
  function snapshot(){ if(sel<0)return; history.push(JSON.stringify(lines[sel],replacer)); if(history.length>50)history.shift(); }
  function undo(){ if(!history.length)return; var l=reviveLine(JSON.parse(history.pop(),reviver)); lines[sel]=l; pendingArc=null; renderStage(); saveDots(); }
  function saveDots(){ renderList(); renderTabs(); save(); }

  function onCellClick(){
    if(activeDim!=='sound') return;
    var ci=+this.dataset.cell, wi=+this.dataset.word, l=lines[sel];
    if(tool==='note'){ openNote(wi,this); return; }
    if(tool==='mut'){ openMut(ci,this); return; }
    if(tool==='beat'){ snapshot(); l.beats.has(wi)?l.beats.delete(wi):l.beats.add(wi); renderStage(); saveDots(); return; }
    if(tool==='pause'){ snapshot(); l.pauses.has(wi)?l.pauses.delete(wi):l.pauses.add(wi); renderStage(); saveDots(); return; }
    if(tool==='strike'){ snapshot(); l.strike.has(ci)?l.strike.delete(ci):(l.strike.add(ci),l.weak.delete(ci),l.flap.delete(ci)); renderStage(); saveDots(); return; }
    if(tool==='weak'){ snapshot(); l.weak.has(ci)?l.weak.delete(ci):(l.weak.add(ci),l.strike.delete(ci),l.flap.delete(ci)); renderStage(); saveDots(); return; }
    if(tool==='flap'){ snapshot(); l.flap.has(ci)?l.flap.delete(ci):(l.flap.add(ci),l.strike.delete(ci),l.weak.delete(ci)); renderStage(); saveDots(); return; }
    if(tool==='ins-w'||tool==='ins-y'){ snapshot(); var g=tool==='ins-w'?'w':'y';
      var ex=l.ins.some(function(x){return x.after===ci&&x.g===g;});
      l.ins = ex ? l.ins.filter(function(x){return !(x.after===ci&&x.g===g);}) : l.ins.concat([{after:ci,g:g}]);
      renderStage(); saveDots(); return; }
    if(tool==='arc'){
      if(pendingArc===null){ pendingArc=ci; renderStage(); }
      else if(pendingArc===ci){ pendingArc=null; renderStage(); }
      else { snapshot(); var a=Math.min(pendingArc,ci),b=Math.max(pendingArc,ci);
        var dup=l.arcs.findIndex(function(p){return p[0]===a&&p[1]===b;});
        if(dup>=0)l.arcs.splice(dup,1); else l.arcs.push([a,b]);
        pendingArc=null; renderStage(); saveDots(); }
    }
  }

  $('mutClear').addEventListener('click',function(){ if(mutCi===null)return; snapshot(); if(lines[sel].mut)delete lines[sel].mut[mutCi]; renderStage(); saveDots(); closeMut(); });
  $('mutCancel').addEventListener('click',closeMut);

  // ---------- right: tabs + editors ----------
  function renderTabs(){
    tabsEl.innerHTML='';
    if(sel<0){ return; }
    var l=lines[sel];
    DIMS.forEach(function(d){
      var t=document.createElement('button'); t.className='tab'+(activeDim===d.k?' on':''); t.style.setProperty('--dc',DC[d.k]);
      t.innerHTML=d.cn+'<span class="en">'+d.en+'</span>';

      tabsEl.appendChild(t);

  function ta(val,ph,oninput,rows){ var t=document.createElement('textarea'); t.value=val||''; t.placeholder=ph||''; t.rows=rows||5; t.addEventListener('input',function(){ oninput(t.value); }); return t; }
  function inp(val,ph,oninput){ var i=document.createElement('input'); i.type='text'; i.value=val||''; i.placeholder=ph||''; i.addEventListener('input',function(){ oninput(i.value); }); return i; }
  function head(cn,en,sub){ var h=document.createElement('div');
    var t=document.createElement('div'); t.className='dim-title'; t.textContent=cn+'  ·  '+en; h.appendChild(t);
    var s=document.createElement('div'); s.className='dim-sub'; s.textContent=sub; h.appendChild(s); return h; }

    if(activeDim==='thinking'){
      teachEl.appendChild(head('思维','Thinking','英语为什么这样表达？——母语者如何组织意义、选择表达、形成结构（重点不是语法）。'));
      teachEl.appendChild(ta(t.thinking,'例如：英文先给结论/动作，再补背景；这里用 …… 而不是 ……，因为……', function(v){t.thinking=v;onEdit();},8));

      teachEl.appendChild(ta(t.resonance,'这句话让我想到……；它其实在说……；放到今天……',function(v){t.resonance=v;onEdit();},8));

      teachEl.appendChild(ta(t.visual,'例如：黄昏窗边，收音机暖光，手指轻敲桌面跟着节奏……',function(v){t.visual=v;onEdit();},7));
      return;
    }
    if(activeDim==='cinematic'){
      teachEl.appendChild(head('电影记忆','Cinematic Memory','把这句话放进一个有角色、有情绪、有前因后果的场景。'));
      var c=t.cinematic;
      [['characters','人物','谁在说 / 谁在场'],['scene','场景','在哪里、什么氛围'],['cause','前因','之前发生了什么'],['moment','此刻','这句话发生的瞬间'],['aftermath','后续','之后会怎样']].forEach(function(f){

  var expScope='current', expContent='sound';
  $('expBtn').addEventListener('click',function(){ if(!lines.length){ toast('先生成句子'); return; } $('exportModal').hidden=false; });
  $('expClose').addEventListener('click',function(){ $('exportModal').hidden=true; });
  $('exportModal').addEventListener('click',function(e){ if(e.target===this) this.hidden=true; });
  $('scopeSeg').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b)return; expScope=b.dataset.s; this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x.dataset.s===expScope);}); });
  $('contentSeg').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b)return; expContent=b.dataset.c; this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x.dataset.c===expContent);}); });
  $('doJson').addEventListener('click',function(){
    var data={v:3,title:titleEl.value,en:enBox.value,zh:zhBox.value,lines:lines};
    var blob=new Blob([JSON.stringify(data,replacer,1)],{type:'application/json'});
    var a=document.createElement('a'); a.download=(titleEl.value||'noya-teaching').replace(/\s+/g,'_')+'.json'; a.href=URL.createObjectURL(blob); a.click();
    toast('已导出 JSON'); $('exportModal').hidden=true;
  });
  $('doImg').addEventListener('click',function(){ $('exportModal').hidden=true; toast('正在生成图片…'); setTimeout(function(){ exportSheetImage(expScope, expContent==='full'); },30); });
  $('doPrint').addEventListener('click',function(){ $('exportModal').hidden=true; printSheet(expScope, expContent==='full'); });

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escNl(s){ return esc(s).replace(/\n/g,'<br>'); }
  function buildSheet(scope, withDims){
    var idxs = scope==='current' ? (sel>=0?[sel]:[]) : lines.map(function(_,i){return i;});
    var sheet=document.createElement('div'); sheet.className='sheet';
    if(titleEl.value.trim()){ var h=document.createElement('div'); h.className='sheet-title'; h.textContent=titleEl.value.trim(); sheet.appendChild(h); }
    var savedPending=pendingArc; pendingArc=null;
    var refs=[];
    idxs.forEach(function(i){
      var l=lines[i], block=document.createElement('div'); block.className='sheet-block';
      var num=document.createElement('div'); num.className='sheet-num'; num.textContent=(i+1<10?'0':'')+(i+1); block.appendChild(num);
      var built=buildLineEl(l); var enw=document.createElement('div'); enw.className='sheet-en'; enw.appendChild(built.el); block.appendChild(enw);
      refs.push({en:built.el,svg:built.svg,l:l});
      if(l.zh){ var zh=document.createElement('div'); zh.className='sheet-zh'; zh.textContent=l.zh; block.appendChild(zh); }
      if(withDims) appendDims(block,l);
      sheet.appendChild(block);
    });
    pendingArc=savedPending;
    return {sheet:sheet, refs:refs};
  }
  function appendDims(block,l){
    var t=l.teach, wrap=document.createElement('div'); wrap.className='sheet-dims';
    function row(lb,html){ var d=document.createElement('div'); d.className='sheet-dim'; d.innerHTML='<b>'+lb+'</b>'+html; wrap.appendChild(d); }
    if(t.thinking.trim()) row('思维', escNl(t.thinking));
    var maps=t.mapping.filter(function(m){return (m.en||'').trim()||(m.zh||'').trim();});
    if(maps.length) row('双语映射', maps.map(function(m){return esc(m.en)+' &nbsp;↕&nbsp; '+esc(m.zh);}).join('　｜　'));
    if(t.resonance.trim()) row('实时共振', escNl(t.resonance));
    if(t.visual.trim()) row('画面觉醒', escNl(t.visual));
    var c=t.cinematic, cin=[['人物',c.characters],['场景',c.scene],['前因',c.cause],['此刻',c.moment],['后续',c.aftermath],['来源',c.source]].filter(function(x){return (x[1]||'').trim();});
    if(cin.length) row('电影记忆', cin.map(function(x){return x[0]+'：'+esc(x[1]);}).join('；&nbsp;'));
    if(t.flow.trim()){ var parts=t.flow.split('\n').map(function(s){return s.trim();}).filter(Boolean); row('Flow', esc(parts.join('  ›  '))); }
    if(wrap.children.length) block.appendChild(wrap);
  }
  function cssVars(){
    var names=['--card','--card-ink','--accent','--accent-soft','--c-arc','--c-weak','--c-strike','--c-ins','--c-flap','--c-beat','--c-pause','--c-mut','--serif','--sans'];
    var rcs=getComputedStyle(document.documentElement); return names.map(function(v){return v+':'+rcs.getPropertyValue(v).trim();}).join(';');
  }
  function rasterize(inner,w,h,ground,filename){
    var css=$('mainstyle').textContent, scale=2;
    var body="<div xmlns='http://www.w3.org/1999/xhtml' style='width:"+w+"px;background:"+ground+";"+cssVars()+"'><style>"+css+"</style>"+inner+"</div>";
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><foreignObject x="0" y="0" width="'+w+'" height="'+h+'">'+body+'</foreignObject></svg>';
    var img=new Image();
    img.onload=function(){ var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
      var ctx=c.getContext('2d'); ctx.fillStyle=ground; ctx.fillRect(0,0,c.width,c.height); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
      var url; try{ url=c.toDataURL('image/png'); }catch(e){ toast('生成失败，请直接截图'); return; }
      showPreview(url,filename); };
    img.onerror=function(){ toast('生成失败，请直接截图'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  }
  function exportSheetImage(scope,withDims){
    var built=buildSheet(scope,withDims); if(!built.refs.length){ toast('没有可导出的句子'); return; }
    var sheet=built.sheet; sheet.style.position='absolute'; sheet.style.left='-99999px'; sheet.style.top='0'; document.body.appendChild(sheet);
    requestAnimationFrame(function(){
      built.refs.forEach(function(r){ drawArcs(r.en,r.svg,r.l); });
      var w=Math.ceil(sheet.scrollWidth), h=Math.ceil(sheet.scrollHeight);
      sheet.removeAttribute('style');
      rasterize(new XMLSerializer().serializeToString(sheet), w, h, '#efe9dc', (titleEl.value||'noya-teaching').replace(/\s+/g,'_')+'.png');
      document.body.removeChild(sheet);
    });
  }
  function printSheet(scope,withDims){
    var built=buildSheet(scope,withDims); if(!built.refs.length){ toast('没有可导出的句子'); return; }
    var area=$('printArea'); area.innerHTML=''; area.appendChild(built.sheet);
    requestAnimationFrame(function(){ built.refs.forEach(function(r){ drawArcs(r.en,r.svg,r.l); });
      setTimeout(function(){ try{ window.print(); }catch(e){ toast('此环境不支持打印，请用「导出图片」'); } }, 80); });
  }
  function showPreview(url,filename){ $('pvImg').src=url; var d=$('pvDownload'); d.href=url; d.download=filename||'noya.png'; $('previewModal').hidden=false; }
  $('pvClose').addEventListener('click',function(){ $('previewModal').hidden=true; });
  $('previewModal').addEventListener('click',function(e){ if(e.target===this) this.hidden=true; });
  $('impFile').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f)return; var r=new FileReader();
    r.onload=function(){ try{ var d=JSON.parse(r.result,reviver);
      titleEl.value=d.title||''; enBox.value=d.en||''; zhBox.value=d.zh||'';
      lines=(d.lines||[]).map(reviveLine); sel=lines.length?0:-1; history=[];
      renderAll(); save(); toast('已导入');
    }catch(err){ toast('导入失败：文件格式不正确'); } };
    r.readAsText(f);
  });

  // ---------- misc ----------
  var toastT=null;
  function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); if(toastT)clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},1800); }
  window.addEventListener('keydown',function(e){
    var typing=/^(TEXTAREA|INPUT)$/.test(e.target.tagName||'');
    if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!typing){ e.preventDefault(); undo(); }
    if(e.key==='Escape'){ if(!$('noteEditor').hidden)closeNote(); if(!$('mutEditor').hidden)closeMut(); }
  });
  window.addEventListener('resize',function(){ if(sel>=0){ var c=document.querySelector('#stageLine .en'); var s=document.querySelector('#stageLine .arclayer'); if(c&&s) requestAnimationFrame(function(){drawArcs(c,s,lines[sel]);}); } });

  function renderAll(){ renderList(); renderStage(); renderTabs(); renderTeach(); }

  // ---------- persistence ----------
  function save(){ try{
    localStorage.setItem('noya3-title',titleEl.value);
    localStorage.setItem('noya3-en',enBox.value);
    localStorage.setItem('noya3-zh',zhBox.value);
    localStorage.setItem('noya3-lines',JSON.stringify(lines,replacer));
  }catch(e){} }
  function load(){ try{
    var ti=localStorage.getItem('noya3-title'), en=localStorage.getItem('noya3-en'), zh=localStorage.getItem('noya3-zh'), ls=localStorage.getItem('noya3-lines');
    if(ti!=null)titleEl.value=ti; if(en!=null)enBox.value=en; if(zh!=null)zhBox.value=zh;
    if(ls){ lines=JSON.parse(ls,reviver).map(reviveLine); sel=lines.length?0:-1; }
    if(!lines.length) document.body.classList.add('editing');
  }catch(e){} }
  enBox.addEventListener('input',save); zhBox.addEventListener('input',save);

  load(); renderAll();
})();
</script>
