<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>诺雅 · 歌曲发音标注 Noya</title>
<style id="mainstyle">
  :root{
    --bg:#17130d;
    --bg2:#1e1810;
    --panel:#221c14;
    --panel-line:#3a3024;
    --ink:#e9e0cf;
    --ink-dim:#a99f8c;
    --accent:#d9a441;
    --accent-soft:#b98a34;
    --card:#efe9dc;
    --card-ink:#2a2320;
    --c-strike:#b1a897;
    --c-weak:#3f8f43;
    --c-arc:#c8563d;
    --c-ins:#3f78c9;
    --serif:"Georgia","Times New Roman","Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
    --sans:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  body{padding:22px 26px 60px;min-height:100vh}

  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:20px}
  .brand .cn{font-size:15px;letter-spacing:.28em;color:var(--ink-dim)}
  .brand .en{font-family:var(--serif);font-style:italic;font-size:22px;margin-top:2px}
  .hint{font-size:13px;color:var(--ink-dim);max-width:380px;text-align:right;line-height:1.6}

  .setup{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:16px 16px 14px;margin-bottom:14px}
  .setup .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.setup .grid{grid-template-columns:1fr}}
  .field label{display:block;font-size:12px;color:var(--ink-dim);margin:0 0 6px 2px;letter-spacing:.06em}
  textarea{width:100%;min-height:120px;resize:vertical;background:#0f0c08;border:1px solid var(--panel-line);
    border-radius:10px;color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.7;padding:12px 14px}
  textarea:focus{outline:none;border-color:var(--accent-soft)}
  .rowbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .rowbtns .spacer{flex:1}
  button{font-family:var(--sans);cursor:pointer;border-radius:999px;padding:9px 18px;font-size:13px;
    background:#2c251a;color:var(--ink);border:1px solid var(--panel-line);transition:.15s}
  button:hover{border-color:var(--accent-soft)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--accent);color:#241a06;font-weight:600;border-color:transparent}
  button.primary:hover{background:#e6b556}
  button.ghost{background:transparent}
  .filebtn{position:relative;overflow:hidden}
  .filebtn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}

  .work{display:flex;gap:16px;align-items:flex-start}
  .toolbar{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:8px;display:flex;
    flex-direction:column;gap:6px;position:sticky;top:14px;flex:0 0 auto;width:72px}
  .tool{width:56px;height:52px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0}
  .tool small{font-size:10px;color:var(--ink-dim);letter-spacing:.02em}
  .tool .ic{font-family:var(--serif);font-size:19px;line-height:1}
  .tool:hover{background:#2a231a}
  .tool.active{background:var(--accent);border-color:transparent}
  .tool.active small,.tool.active .ic{color:#241a06}
  .tool.active small{color:#4a3a12}
  .tsep{height:1px;background:var(--panel-line);margin:4px 6px}

  .stage{flex:1;min-width:0}
  #card{background:var(--card);color:var(--card-ink);border-radius:18px;padding:44px 46px;min-height:280px}
  .line{position:relative;font-family:var(--serif);padding:34px 4px 8px;scroll-margin:40vh}
  .line .en{font-size:34px;line-height:1;letter-spacing:.02em;white-space:normal;position:relative;z-index:1}
  .line .zh{font-family:var(--serif);font-size:17px;color:#6f665a;margin-top:12px;letter-spacing:.03em}
  .line.hidezh .zh{display:none}
  .cell{display:inline-block;position:relative;cursor:pointer;padding:0 .5px;transition:color .12s,background .12s;border-radius:3px}
  .cell.space{width:.32em;cursor:default}
  .cell.letter:hover{color:var(--accent-soft)}
  .cell.pending{background:rgba(217,164,65,.35);border-radius:4px}
  .cell.strike{color:var(--c-strike)}
  .cell.strike::after{content:"";position:absolute;left:-1px;right:-1px;top:52%;height:2px;background:var(--c-strike);
    transform:rotate(-18deg);border-radius:2px}
  .cell.weak{color:var(--c-weak)}
  /* karaoke */
  .cell.ksung{background:rgba(217,164,65,.20)}
  .cell.kcur{background:rgba(217,164,65,.55)}
  .cell.ktarget{box-shadow:inset 0 -2.5px 0 var(--accent)}
  .ins{display:inline-block;color:var(--c-ins);font-size:.62em;vertical-align:.5em;font-style:italic;font-family:var(--serif);
    margin:0 .02em;cursor:pointer}
  svg.arclayer{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:2}
  .arcpath{fill:none;stroke:var(--c-arc);stroke-width:2.2;stroke-linecap:round}
  .empty{color:#9c9384;font-family:var(--serif);font-size:18px;text-align:center;padding:60px 0}

  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--ink-dim);
    background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:11px 16px}
  .legend b{font-weight:600;color:var(--ink)}
  .lg{display:flex;align-items:center;gap:7px}
  .swatch{width:22px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:13px;background:var(--card)}
  .sw-strike{color:var(--c-strike);text-decoration:line-through}
  .sw-weak{color:var(--c-weak)}
  .sw-arc{color:var(--c-arc)}
  .sw-ins{color:var(--c-ins);font-style:italic}
  .sw-k{background:rgba(217,164,65,.55)}

  /* audio + sync bar */
  .barwrap{margin-top:14px;background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:12px 14px;
    display:flex;flex-direction:column;gap:12px}
  .rowflex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .barwrap audio{height:34px}
  .nm{font-size:12px;color:var(--ink-dim)}
  .seg{display:inline-flex;border:1px solid var(--panel-line);border-radius:999px;overflow:hidden}
  .seg button{border:none;border-radius:0;padding:7px 14px;background:transparent}
  .seg button.on{background:var(--accent);color:#241a06;font-weight:600}
  .synchint{font-size:12.5px;color:var(--ink-dim);line-height:1.5}
  kbd{background:#0f0c08;border:1px solid var(--panel-line);border-radius:5px;padding:1px 7px;font-family:var(--serif);color:var(--ink)}
  .tapbtn{background:var(--accent);color:#241a06;font-weight:700;font-size:15px;padding:11px 26px;border:none}
  .divi{width:1px;height:22px;background:var(--panel-line)}

  body.present .setup,body.present header,body.present .toolbar,body.present .legend{display:none}
  body.present{background:var(--card);padding:20px}
  body.present #card{padding:5vh 6vw}
  body.present .line .en{font-size:44px}
  body.present .barwrap{background:transparent;border:none}
  .exitpresent{position:fixed;top:14px;right:16px;z-index:50;display:none}
  body.present .exitpresent{display:block}

  /* ---------- practice (sentence-by-sentence) view ---------- */
  body.practice .toolbar,body.practice .legend{display:none}
  #cardPractice{display:none}
  body.practice #card{display:none}
  body.practice #cardPractice{display:block}
  .pcard{background:var(--card);color:var(--card-ink);border-radius:14px;padding:16px 18px;display:flex;gap:16px;
    align-items:flex-start;margin-bottom:12px}
  .pcard.pactive{box-shadow:0 0 0 2px var(--accent)}
  .pnum{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid #cabfa8;color:#8a7f6a;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-family:var(--sans);margin-top:4px;font-variant-numeric:tabular-nums}
  .pbody{flex:1;min-width:0}
  .pen{font-family:var(--serif);font-size:23px;line-height:1.5;position:relative;padding-top:20px}
  .pword{display:inline-block;border-radius:4px;padding:0 1px}
  body.kwmode .pword{cursor:pointer}
  body.kwmode .pword:hover{background:rgba(217,164,65,.18)}
  .pword.kw{background:rgba(217,164,65,.40)}
  .pen .pcell{display:inline-block;position:relative}
  .pen .pcell.strike{color:var(--c-strike)}
  .pen .pcell.strike::after{content:"";position:absolute;left:-1px;right:-1px;top:52%;height:2px;background:var(--c-strike);
    transform:rotate(-18deg);border-radius:2px}
  .pen .pcell.weak{color:var(--c-weak)}
  .pspace{display:inline-block}
  /* practice control bar */
  #pbar{display:none;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;background:var(--panel);
    border:1px solid var(--panel-line);border-radius:12px;padding:10px 14px}
  body.practice #pbar{display:flex}
  body.present #pbar{display:none}
  .pcard.ptarget{box-shadow:0 0 0 2px var(--c-arc)}
  .pzh{font-family:var(--serif);font-size:15.5px;color:#6f665a;margin-top:7px;letter-spacing:.02em}
  .pctrl{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:150px}
  .prow{display:flex;align-items:center;gap:6px}
  .pplay{width:34px;height:34px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;
    background:var(--card-ink);color:var(--card);border:none;font-size:13px}
  .pplay:hover{background:#000}
  .ploop{width:30px;height:30px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;
    background:transparent;color:#8a7f6a;border:1px solid #cabfa8;font-size:13px}
  .ploop.on{background:var(--accent);color:#241a06;border-color:transparent}
  .ptime{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:12.5px;color:#8a7f6a;min-width:52px;text-align:right}
  .padj{display:flex;gap:4px}
  .padj button{padding:4px 8px;font-size:11px;background:#e2dccb;color:#4a4234;border:1px solid #cfc7b3;border-radius:7px}
  .padj button:hover{border-color:var(--accent-soft)}
  .padj button.here{background:#c8563d;color:#fff;border-color:transparent;font-weight:600}
  .padj button.here:hover{background:#b44a33}
  body.present .pctrl,body.present .pnum{display:none}
  body.present .pcard{background:var(--card);box-shadow:none;margin-bottom:20px}
  body.present .pen{font-size:34px}
  body.present .pcard.pactive .pen{color:#000}
</style>

<header>
  <div class="brand">
    <div class="cn">诺雅 · 歌曲发音标注</div>
    <div class="en">Noya Pronunciation Studio</div>
  </div>
  <div class="hint">粘贴歌词 → 生成标注区 → 逐字标注四种连读。载入音频后可「打轴」录制卡拉OK逐字时间轴，再「跟唱播放」高亮当前字。</div>
</header>

<section class="setup" id="setup">
  <div class="grid">
    <div class="field">
      <label>英文歌词（每行一句）</label>
      <textarea id="en" placeholder="在此粘贴英文歌词，每行一句…"></textarea>
    </div>
    <div class="field">
      <label>中文可演唱版（每行一句，与英文按行对应，可留空）</label>
      <textarea id="zh" placeholder="在此粘贴中文，每行与左边英文对应…"></textarea>
    </div>
  </div>
  <div class="rowbtns">
    <button class="primary" id="gen">生成标注区</button>
    <button class="ghost" id="clearText">清空文本</button>
    <button class="filebtn" id="audioBtn">载入音频<input type="file" id="audioFile" accept="audio/*"></button>
    <span class="seg" id="viewSeg" style="margin-left:6px">
      <button data-view="anno" class="on">标注</button>
      <button data-view="practice">练习页</button>
    </span>
    <div class="spacer"></div>
    <button class="ghost" id="kwBtn" style="display:none">标关键词</button>
    <button class="ghost" id="toggleZh">显示/隐藏中文</button>
    <button class="ghost" id="present">演示模式</button>
    <button class="ghost" id="exportPng">导出 PNG</button>
  </div>
</section>

<div class="work">
  <div class="toolbar" id="toolbar">
    <button class="tool active" data-tool="arc"    title="连读弧线：先点起点字母，再点终点字母"><span class="ic">⌒</span><small>连读</small></button>
    <button class="tool"        data-tool="strike" title="划掉/吞音：字母变灰并加斜线"><span class="ic">a̸</span><small>划掉</small></button>
    <button class="tool"        data-tool="weak"   title="弱读：字母变绿"><span class="ic" style="color:var(--c-weak)">ə</span><small>弱读</small></button>
    <button class="tool"        data-tool="ins-w"  title="增音 w：在两元音间插入 w"><span class="ic" style="color:var(--c-ins)">ʷ</span><small>加 w</small></button>
    <button class="tool"        data-tool="ins-y"  title="增音 y：在两元音间插入 y"><span class="ic" style="color:var(--c-ins)">ʲ</span><small>加 y</small></button>
    <div class="tsep"></div>
    <button class="tool" id="undo"  title="撤销上一步"><span class="ic">↶</span><small>撤销</small></button>
    <button class="tool" id="clearAnno" title="清除本页所有标注"><span class="ic">🗑</span><small>清标注</small></button>
  </div>

  <div class="stage">
    <div id="card"><div class="empty">在上方粘贴歌词，点「生成标注区」开始标注</div></div>

    <div id="pbar">
      <button id="pTapBtn" class="primary">▶ 逐句打点</button>
      <button id="pTapBack" hidden>退一步</button>
      <span class="divi"></span>
      <span class="nm">速度</span>
      <span class="seg" id="rateSeg">
        <button data-rate="0.5">0.5×</button>
        <button data-rate="0.75">0.75×</button>
        <button data-rate="1" class="on">1×</button>
      </span>
      <span class="synchint" id="pTapHint" hidden>播放后，在<b>每句开头</b>按 <kbd>空格</kbd>（或点该句卡片）打一下点，自动跳下一句；<kbd>Backspace</kbd> 纠正。</span>
    </div>
    <div id="cardPractice"></div>

    <div class="barwrap" id="barwrap" style="display:none">
      <div class="rowflex">
        <audio id="player" controls></audio>
        <span class="nm" id="audioName"></span>
      </div>
      <div class="rowflex">
        <span class="nm">卡拉OK时间轴</span>
        <span class="seg" id="granSeg">
          <button data-gran="word" class="on">逐词</button>
          <button data-gran="line">逐行</button>
        </span>
        <div class="divi"></div>
        <button id="syncToggle">开始打轴</button>
        <button id="tapBtn" class="tapbtn" hidden>打点 ▮</button>
        <button id="syncBack" hidden>退一步</button>
        <div class="divi"></div>
        <button id="playKtoggle">跟唱播放</button>
        <button class="ghost" id="clearTimes">清时间轴</button>
        <div class="spacer" style="flex:1"></div>
        <button class="ghost" id="exportJson">导出工程</button>
        <button class="ghost filebtn" id="importBtn">导入工程<input type="file" id="importFile" accept="application/json"></button>
      </div>
      <div class="synchint" id="synchint" hidden>
        打轴中：按 <kbd>空格</kbd> 或点「打点」在<b id="granWord">每个词</b>被唱到的瞬间打一下点；<kbd>Backspace</kbd> 或「退一步」纠正。再点「开始打轴」结束。
      </div>
    </div>

    <div class="legend">
      <span class="lg"><span class="swatch sw-arc">⌒</span><b>连读</b> 弧线相连</span>
      <span class="lg"><span class="swatch sw-strike">t</span><b>划掉</b> 吞音/失爆</span>
      <span class="lg"><span class="swatch sw-weak">a</span><b>弱读</b> 变绿</span>
      <span class="lg"><span class="swatch sw-ins">ʷ</span><b>增音</b> 加 w / y</span>
      <span class="lg"><span class="swatch sw-k">词</span><b>卡拉OK</b> 高亮当前字</span>
    </div>
  </div>
</div>

<button class="primary exitpresent" id="exitPresent">退出演示</button>

<script>
(function(){
  "use strict";
  var card=document.getElementById('card');
  var enBox=document.getElementById('en');
  var zhBox=document.getElementById('zh');
  var player=document.getElementById('player');

  // lines: [{cells, zh, strike:Set, weak:Set, arcs:[[a,b]], ins:[{after,g}], words:[{cells:[ci]}], wtimes:[t|null], lstart:t|null}]
  var lines=[];
  var tool='arc';
  var pendingArc=null;
  var showZh=true;
  var history=[];
  var timesMode='word';          // 'word' | 'line'
  var syncMode=false, syncCursor=0;
  var flatW=[], flatL=[];        // sync cursors
  var lastActive=-1;

  // ---------- snapshot / undo ----------
  function replacer(k,v){ return v instanceof Set ? {__set:Array.from(v)} : v; }
  function reviver(k,v){ return (v && v.__set) ? new Set(v.__set) : v; }
  function snapshot(){ history.push(JSON.stringify(lines,replacer)); if(history.length>60) history.shift(); }
  function undo(){
    if(!history.length) return;
    lines=JSON.parse(history.pop(),reviver);
    lines.forEach(function(l){ l.strike=new Set(l.strike); l.weak=new Set(l.weak); l.kw=new Set(l.kw); });
    pendingArc=null; buildFlat(); render(); renderPractice(); save();
  }

  // ---------- build ----------
  function computeWords(line){
    var words=[],cur=null;
    line.cells.forEach(function(cell,ci){
      if(cell.isLetter){ if(!cur){cur={cells:[]};words.push(cur);} cur.cells.push(ci); }
      else cur=null;
    });
    return words;
  }
  function build(){
    var en=enBox.value.replace(/\r/g,'').split('\n');
    var zh=zhBox.value.replace(/\r/g,'').split('\n');
    while(en.length>1 && en[en.length-1].trim()==='') en.pop();
    lines=en.map(function(text,i){
      var cells=[];
      for(var j=0;j<text.length;j++) cells.push({ch:text[j],isLetter:/[^\s]/.test(text[j])});
      var l={cells:cells,zh:(zh[i]||'').trim(),strike:new Set(),weak:new Set(),arcs:[],ins:[],kw:new Set(),lstart:null};
      l.words=computeWords(l); l.wtimes=l.words.map(function(){return null;});
      return l;
    });
    history=[]; pendingArc=null; loopSet=new Set(); buildFlat(); render(); renderPractice(); save();
  }
  function buildFlat(){
    flatW=[]; flatL=[];
    lines.forEach(function(l,li){
      if(l.words && l.words.length){
        flatL.push(li);
        l.words.forEach(function(w,wi){ flatW.push({li:li,wi:wi}); });
      }
    });
  }

  // ---------- render ----------
  function render(){
    card.innerHTML='';
    if(!lines.length || (lines.length===1 && !lines[0].cells.length)){
      card.innerHTML='<div class="empty">在上方粘贴歌词，点「生成标注区」开始标注</div>';
      return;
    }
    lines.forEach(function(line,li){
      var row=document.createElement('div');
      row.className='line'+(showZh?'':' hidezh');
      var en=document.createElement('div'); en.className='en';
      line.cells.forEach(function(cell,ci){
        var sp=document.createElement('span');
        if(!cell.isLetter){
          sp.className='cell space';
          sp.innerHTML = cell.ch===' ' ? '&nbsp;' : cell.ch;
        }else{
          sp.className='cell letter';
          if(line.strike.has(ci)) sp.className+=' strike';
          if(line.weak.has(ci)) sp.className+=' weak';
          if(pendingArc && pendingArc.line===li && pendingArc.cell===ci) sp.className+=' pending';
          sp.textContent=cell.ch;
          sp.dataset.line=li; sp.dataset.cell=ci;
          sp.addEventListener('click',onCellClick);
        }
        en.appendChild(sp);
        line.ins.forEach(function(ins){
          if(ins.after===ci){
            var g=document.createElement('span');
            g.className='ins'; g.textContent=ins.g; g.title='点击删除增音';
            g.addEventListener('click',function(e){
              e.stopPropagation(); snapshot();
              line.ins=line.ins.filter(function(x){return !(x.after===ins.after&&x.g===ins.g);});
              render(); save();
            });
            en.appendChild(g);
          }
        });
      });
      var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('class','arclayer'); en.appendChild(svg);
      row.appendChild(en);
      if(line.zh){ var zh=document.createElement('div'); zh.className='zh'; zh.textContent=line.zh; row.appendChild(zh); }
      card.appendChild(row);
      row._svg=svg; row._en=en;
    });
    requestAnimationFrame(drawArcs);
    lastActive=-1;
    if(syncMode) paintSync();
  }
  function drawArcs(){
    lines.forEach(function(line,li){
      var row=card.children[li]; if(!row||!row._svg) return;
      var svg=row._svg,en=row._en; while(svg.firstChild) svg.removeChild(svg.firstChild);
      var base=en.getBoundingClientRect();
      line.arcs.forEach(function(arc){
        var a=en.querySelector('.cell[data-cell="'+arc[0]+'"]'),b=en.querySelector('.cell[data-cell="'+arc[1]+'"]');

    if(tool==='strike'){ snapshot();

      render(); save();
    }else if(tool==='weak'){ snapshot();

      render(); save();
    }else if(tool==='ins-w'||tool==='ins-y'){ snapshot();
      var g=(tool==='ins-w')?'w':'y';
      var ex=line.ins.some(function(x){return x.after===ci&&x.g===g;});
      if(ex) line.ins=line.ins.filter(function(x){return !(x.after===ci&&x.g===g);});
      else line.ins.push({after:ci,g:g});
      render(); save();
    }else if(tool==='arc'){
      if(!pendingArc){ pendingArc={line:li,cell:ci}; render(); }

      else if(pendingArc.line===li){ snapshot();
        var a=Math.min(pendingArc.cell,ci),b=Math.max(pendingArc.cell,ci);
        var dup=line.arcs.findIndex(function(p){return p[0]===a&&p[1]===b;});

  function exportImage(returnUrl){

    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
      var ctx=c.getContext('2d'); ctx.fillStyle=ground; ctx.fillRect(0,0,c.width,c.height); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
      var url; try{ url=c.toDataURL('image/png'); }catch(err){ alert('自动导出失败，请直接截图使用。'); return; }
      if(returnUrl){ window.__lastExport=url; return; }
      var a=document.createElement('a'); a.download=practice?'noya-practice.png':'noya-lyrics.png'; a.href=url; a.click();
    };
    img.onerror=function(){ alert('自动导出失败，请直接截图（Win: Win+Shift+S / Mac: Cmd+Shift+4）。'); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  }

  // ---------- project export / import ----------
  document.getElementById('exportJson').addEventListener('click',function(){
    var data={v:2,en:enBox.value,zh:zhBox.value,timesMode:timesMode,lines:lines};
    var blob=new Blob([JSON.stringify(data,replacer)],{type:'application/json'});
    var a=document.createElement('a'); a.download='noya-project.json'; a.href=URL.createObjectURL(blob); a.click();
  });
  document.getElementById('importFile').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){ try{
      var d=JSON.parse(r.result,reviver);
      enBox.value=d.en||''; zhBox.value=d.zh||''; timesMode=d.timesMode||'word';
      lines=(d.lines||[]).map(function(l){ l.strike=new Set(l.strike); l.weak=new Set(l.weak); l.kw=new Set(l.kw);
        if(!l.words) l.words=computeWords(l); if(!l.wtimes) l.wtimes=l.words.map(function(){return null;});
        if(l.lstart===undefined) l.lstart=null; return l; });
      granSeg.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x.dataset.gran===timesMode);});
      loopSet=new Set(); buildFlat(); render(); renderPractice(); save();
    }catch(err){ alert('导入失败：文件格式不正确。'); } };
    r.readAsText(f);
  });

  // ---------- persistence ----------
  function save(){ try{
    localStorage.setItem('noya2-en',enBox.value);
    localStorage.setItem('noya2-zh',zhBox.value);
    localStorage.setItem('noya2-mode',timesMode);
    localStorage.setItem('noya2-view',mode);
    localStorage.setItem('noya2-lines',JSON.stringify(lines,replacer));
  }catch(e){} }
  function load(){ try{
    var e=localStorage.getItem('noya2-en'),z=localStorage.getItem('noya2-zh'),
        m=localStorage.getItem('noya2-mode'),v=localStorage.getItem('noya2-view'),l=localStorage.getItem('noya2-lines');
    if(e!=null) enBox.value=e; if(z!=null) zhBox.value=z;
    if(m){ timesMode=m; granSeg.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x.dataset.gran===m);}); }
    if(l){ lines=JSON.parse(l,reviver); lines.forEach(function(x){ x.strike=new Set(x.strike); x.weak=new Set(x.weak); x.kw=new Set(x.kw);
      if(!x.words) x.words=computeWords(x); if(!x.wtimes) x.wtimes=x.words.map(function(){return null;});
      if(x.lstart===undefined) x.lstart=null; }); buildFlat(); render(); renderPractice(); }
    if(v==='practice'){
      mode='practice'; document.body.classList.add('practice');
      document.getElementById('viewSeg').querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x.dataset.view==='practice');});
      document.getElementById('kwBtn').style.display=''; renderPractice();
    }
  }catch(e){} }
  enBox.addEventListener('input',save);
  zhBox.addEventListener('input',save);

  load();
})();
</script>
