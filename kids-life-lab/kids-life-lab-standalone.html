<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOYA Kids · Life Lab</title>
  <meta name="description" content="孩子自己的小世界 — 学习、生活、责任、成长、金钱与选择。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🏝️</text></svg>" />
  <style>
/* ============================================================
   NOYA Kids · Life Lab — styles
   storybook · exploration map · warm paper · quiet gamification
   ============================================================ */

:root{
  --paper:#f2eadb; --paper-2:#ece2cf;
  --card:#faf5e9; --card-2:#f4ecd9;
  --ink:#40382e; --ink-2:#726553; --ink-3:#9a8d78;
  --line:#e6dcc5; --line-2:#dccfb3;
  --gold:#b8894b; --gold-soft:#c7a86f;
  --rose:#c67e79; --sage:#85a16e; --clay:#c08763; --sky:#86a9c4; --teal:#5c9187;

  /* map sea (overridden per world theme) */
  --sea-1:#f6ede0; --sea-2:#efd9cb; --sea-line:#e2c4b2; --route:#c99a7f;
  --orb:#d59a76;

  --serif:"Georgia","Iowan Old Style","Palatino Linotype","Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;

  --shadow:0 10px 30px -14px rgba(70,55,35,.28);
  --shadow-sm:0 4px 14px -8px rgba(70,55,35,.30);
  --radius:20px;
}

/* world tints */
[data-theme="sunrise"]{ --sea-1:#f7eee1; --sea-2:#f0d8c8; --sea-line:#e4c5b1; --route:#c99a7f; --orb:#d99a72; }
[data-theme="meadow"]{ --sea-1:#eef1e2; --sea-2:#dae7cf; --sea-line:#c5d5b4; --route:#9db487; --orb:#8fa972; }

*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 15% -5%, #fbf4e6 0%, transparent 55%),
    radial-gradient(1000px 700px at 95% 10%, #f5ecda 0%, transparent 50%),
    var(--paper);
  background-attachment:fixed;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
/* faint paper grain */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(120,95,60,.035) 0 1px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(120,95,60,.03) 0 1px, transparent 1px),
    radial-gradient(circle at 40% 80%, rgba(120,95,60,.03) 0 1px, transparent 1px);
  background-size:7px 7px, 11px 11px, 9px 9px;
}
#app{position:relative; z-index:1; max-width:1160px; margin:0 auto; padding:0 24px 80px}
button{font-family:inherit; cursor:pointer}
h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0; letter-spacing:.01em}

/* ---------------- topbar ---------------- */
.topbar{
  display:flex; align-items:center; gap:20px;
  padding:22px 4px 18px; position:sticky; top:0; z-index:40;
  background:linear-gradient(var(--paper) 72%, transparent);
  backdrop-filter:blur(2px);
}
.brand{display:flex; align-items:center; gap:10px; flex:0 0 auto}
.brand-mark{color:var(--gold); font-size:20px; transform:translateY(1px)}
.brand-name{font-family:var(--serif); font-size:19px; letter-spacing:.03em; color:var(--ink)}
.brand-dot{color:var(--gold)}
.switcher{display:flex; gap:10px; margin-left:6px; flex:1 1 auto}
.chip{
  display:inline-flex; align-items:center; gap:9px;
  border:1px solid var(--line-2); background:var(--card);
  padding:8px 16px 8px 10px; border-radius:999px; color:var(--ink-2);
  font-size:15px; transition:.18s; box-shadow:var(--shadow-sm);
}
.chip .chip-orb{width:16px; height:16px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff6, transparent 60%), var(--orb);
  box-shadow:inset 0 0 0 2px #fff8; }
.chip[data-theme="sunrise"] .chip-orb{ --orb:#d99a72 }
.chip[data-theme="meadow"] .chip-orb{ --orb:#8fa972 }
.chip:hover{transform:translateY(-1px); color:var(--ink)}
.chip.on{background:var(--ink); color:#f7efdf; border-color:var(--ink)}
.chip.on .chip-orb{box-shadow:inset 0 0 0 2px #fff4, 0 0 0 3px #ffffff22}
.parent-btn{
  border:1px solid var(--line-2); background:transparent; color:var(--ink-2);
  padding:9px 16px; border-radius:999px; font-size:14px; transition:.18s;
}
.parent-btn:hover{background:var(--card); color:var(--ink)}
.parent-btn.on{background:var(--gold); color:#fff; border-color:var(--gold)}

/* ---------------- hero ---------------- */
.hero{
  display:flex; justify-content:space-between; align-items:flex-end; gap:24px;
  padding:26px 8px 20px;
}
.hero-kicker{font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin-bottom:8px}
.hero-title{font-size:clamp(38px,6vw,66px); line-height:1; letter-spacing:.06em; color:var(--ink)}
.hero-motto{font-family:var(--serif); font-style:italic; color:var(--ink-2); margin:12px 0 0; font-size:17px}
.hero-right{display:flex; align-items:center; gap:22px; flex:0 0 auto}
.hero-stat{text-align:center; line-height:1.1}
.hero-stat b{display:block; font-family:var(--serif); font-size:26px; color:var(--ink)}
.hero-stat span{font-size:12px; color:var(--ink-3)}
.hero-season{font-size:13px; color:var(--ink-2); border-left:1px solid var(--line-2); padding-left:20px}

/* ---------------- portals ---------------- */
.portals{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:8px 0 22px}
.portal{
  display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:14px 16px; text-align:left; transition:.18s; box-shadow:var(--shadow-sm);
}
.portal span{font-size:22px}
.portal b{font-size:15px; color:var(--ink); margin-top:4px}
.portal i{font-style:normal; font-size:11px; letter-spacing:.08em; color:var(--ink-3); text-transform:uppercase}
.portal:hover{transform:translateY(-2px); border-color:var(--gold-soft)}

/* ---------------- cards ---------------- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px 24px; margin-bottom:22px; box-shadow:var(--shadow);
}
.card-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.card-head h2{font-size:21px; color:var(--ink)}
.card-sub{font-size:13px; color:var(--ink-3)}

/* ---------------- today ---------------- */
.quests{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
.quest{
  display:flex; align-items:center; gap:13px; text-align:left;
  background:var(--card-2); border:1px solid var(--line); border-radius:14px;
  padding:13px 15px; transition:.16s; position:relative; overflow:hidden;
}
.quest::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--isl); opacity:.75}
.quest:hover{transform:translateY(-1px); border-color:var(--isl)}
.quest-check{
  width:24px; height:24px; border-radius:50%; flex:0 0 auto;
  border:2px solid var(--isl); color:#fff; display:grid; place-items:center; font-size:13px; transition:.16s;
}
.quest.done .quest-check{background:var(--isl)}
.quest.done{opacity:.62}
.quest.done .quest-title{text-decoration:line-through; text-decoration-color:var(--ink-3)}
.quest-icon{font-size:20px}
.quest-main{display:flex; flex-direction:column}
.quest-title{font-size:15px; color:var(--ink)}
.quest-tag{font-size:11.5px; color:var(--ink-3)}

/* ---------------- world map ---------------- */
.mapwrap{border-radius:22px; overflow:hidden}
.worldmap{width:100%; height:auto; display:block}
.worldmap .isle{cursor:pointer}
.worldmap .isle-body{transition:transform .25s ease}
.worldmap .isle:hover .isle-body{transform:translateY(-5px)}
.worldmap .isle:focus{outline:none}
.worldmap .isle:focus .isle-body{transform:translateY(-5px)}
.worldmap .isle-no{font-family:var(--serif); font-size:13px; fill:#fff; opacity:.9; letter-spacing:.1em}
.worldmap .isle-name{font-family:var(--serif); font-size:19px; fill:var(--ink); font-weight:600}
.worldmap .isle-en{font-size:10px; fill:var(--ink-3); letter-spacing:.14em; text-transform:uppercase}
.worldmap .isle.cheer .isle-body{animation:isleCheer .9s ease}
@keyframes isleCheer{0%{transform:translateY(0)}30%{transform:translateY(-12px)}60%{transform:translateY(-2px)}100%{transform:translateY(0)}}
.walker,.boat{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ---------------- baseline & beyond ---------------- */
.bb{display:grid; grid-template-columns:1fr 1fr; gap:22px}
.bb .card{margin-bottom:0}
.baseline-list{display:flex; flex-direction:column; gap:9px}
.bl-item{display:flex; align-items:center; gap:12px; background:var(--card-2);
  border:1px solid var(--line); border-radius:12px; padding:11px 14px; text-align:left; transition:.15s}
.bl-item:hover{border-color:var(--sage)}
.bl-check{width:22px; height:22px; border-radius:7px; border:2px solid var(--sage);
  color:#fff; display:grid; place-items:center; font-size:12px; flex:0 0 auto}
.bl-item.done .bl-check{background:var(--sage)}
.bl-item.done{opacity:.6}
.bl-ic{font-size:17px}
.bl-title{font-size:14.5px; color:var(--ink)}
.beyond-list{display:flex; flex-direction:column; gap:9px}
.by-item{display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:12px;
  background:var(--card-2); border:1px dashed var(--line-2)}
.by-ic{font-size:18px}
.by-main{display:flex; flex-direction:column; flex:1}
.by-title{font-size:14.5px; color:var(--ink)}
.by-status{font-size:11.5px; color:var(--ink-3)}
.by-item.st-done{border-style:solid; border-color:var(--gold-soft); background:#f7edd6}
.by-credit{font-size:13px; color:var(--gold); font-family:var(--serif)}
.by-hint{margin-top:12px; font-size:12px; color:var(--ink-3); font-style:italic}

.worldfoot{display:flex; justify-content:space-between; align-items:center;
  margin-top:26px; padding-top:16px; border-top:1px solid var(--line); color:var(--ink-3); font-size:13px}
.linkbtn{background:none; border:none; color:var(--ink-3); text-decoration:underline dotted; font-size:13px}
.linkbtn:hover{color:var(--gold)}

/* ---------------- modal ---------------- */
.modal-back{position:fixed; inset:0; z-index:60; display:grid; place-items:center;
  background:rgba(52,42,28,.42); backdrop-filter:blur(3px); opacity:0; transition:opacity .2s; padding:20px}
.modal-back.in{opacity:1}
.modal{background:var(--card); border:1px solid var(--line-2); border-radius:24px; width:min(680px,100%);
  max-height:88vh; overflow:auto; box-shadow:0 30px 70px -24px rgba(50,38,22,.55);
  transform:translateY(14px) scale(.98); transition:transform .22s ease}
.modal.wide{width:min(820px,100%)}
.modal.lab{width:min(560px,100%)}
.modal-back.in .modal{transform:none}
.modal-head{display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:20px 24px 12px; position:sticky; top:0; background:linear-gradient(var(--card) 78%, transparent)}
.modal-title{font-family:var(--serif); font-size:22px; color:var(--ink); display:flex; align-items:center; gap:8px}
.mt-en{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.mt-ic{font-size:12px}
.modal-close{width:34px; height:34px; border-radius:50%; border:1px solid var(--line-2);
  background:var(--card-2); color:var(--ink-2); font-size:14px}
.modal-close:hover{background:var(--ink); color:#fff}
.modal-body{padding:6px 24px 26px}

/* island panel */
.isle-panel{--isl:#c6a15b}
.ip-hero{display:flex; gap:16px; align-items:center; margin-bottom:16px}
.ip-badge{width:52px; height:52px; border-radius:14px; background:var(--isl); color:#fff;
  display:grid; place-items:center; font-family:var(--serif); font-size:20px; flex:0 0 auto}
.ip-en{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.ip-blurb{font-size:14px; color:var(--ink-2); margin-top:3px}
.ip-progress{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.ip-bar{flex:1; height:12px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); overflow:hidden}
.ip-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--isl),var(--isl-tint)); transition:width .4s ease}
.ip-progress b{font-family:var(--serif); color:var(--isl)}
.ip-note{font-style:italic; color:var(--ink-2); margin:0 0 16px}
.ip-items{display:grid; gap:9px}
.ip-item{display:flex; align-items:center; gap:12px; background:var(--card-2); border:1px solid var(--line);
  border-radius:12px; padding:12px 15px; text-align:left; transition:.15s}
.ip-item:hover{border-color:var(--isl)}
.ip-check{width:22px; height:22px; border-radius:50%; border:2px solid var(--isl); color:#fff;
  display:grid; place-items:center; font-size:12px}
.ip-item.done .ip-check{background:var(--isl)}
.ip-item.done{opacity:.6}
.ip-item span:last-child{font-size:15px; color:var(--ink)}

/* money panel */
.money-top{display:flex; gap:18px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:16px}
.money-total{display:flex; align-items:baseline; gap:6px; background:var(--card-2);
  border:1px solid var(--line); border-radius:16px; padding:14px 20px}
.mt-label{font-size:12px; letter-spacing:.1em; color:var(--ink-3); margin-right:6px}
.mt-num{font-family:var(--serif); font-size:34px; color:var(--teal)}
.mt-unit{font-size:13px; color:var(--ink-3)}
.money-goal{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-2); flex:1; min-width:220px}
.goal-bar{flex:1; height:10px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); overflow:hidden}
.goal-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--clay),#e0b183); transition:width .4s}
.goal-pct{font-family:var(--serif); color:var(--clay)}
.coin-tray{display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:#f6edd7;
  border:1px dashed var(--gold-soft); border-radius:14px; padding:12px 16px; margin-bottom:16px}
.tray-label{font-size:13px; color:var(--ink-2)}
.coins{display:flex; gap:10px}
.coin{width:40px; height:40px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--serif); font-size:16px; color:#7a5a23; cursor:grab; user-select:none;
  background:radial-gradient(circle at 34% 30%, #f6e3a9, #d9b566 70%); border:1px solid #c29a45;
  box-shadow:0 3px 8px -3px rgba(120,90,30,.5)}
.coin:active{cursor:grabbing; transform:scale(.94)}
.vessels{display:grid; grid-template-columns:repeat(5,1fr); gap:12px}
.vessel{position:relative; background:var(--card-2); border:1px solid var(--line); border-radius:16px;
  padding:14px 10px 12px; text-align:center; transition:.16s; --pc:#888}
.vessel.drop{border-style:dashed}
.vessel.over{border-color:var(--pc); background:#fff; transform:translateY(-2px); box-shadow:var(--shadow-sm)}
.vessel.is-available{background:#f6edd7; border-color:var(--gold-soft)}
.vessel-art{height:44px; display:grid; place-items:end center}
.vessel-art svg{width:56px; height:30px}
.vessel-amt{font-family:var(--serif); font-size:24px; color:var(--ink); margin-top:4px}
.vessel-name{font-size:13px; color:var(--ink); margin-top:2px}
.vessel-name i{font-style:normal; font-size:9px; letter-spacing:.1em; color:var(--ink-3); display:block; text-transform:uppercase}
.vessel-desc{font-size:11px; color:var(--ink-3); margin-top:3px; min-height:26px}
.vessel-return{position:absolute; top:8px; right:8px; width:26px; height:22px; border-radius:8px;
  border:1px solid var(--line-2); background:var(--card); color:var(--ink-3); font-size:11px}
.vessel-return:hover{background:var(--pc); color:#fff; border-color:var(--pc)}
.vessel-goal{font-size:10px; color:var(--clay); margin-top:4px}
.money-hint{text-align:center; font-size:12.5px; color:var(--ink-3); font-style:italic; margin:16px 0 0}

/* journey */
.jp-intro{font-size:14px; color:var(--ink-2); margin:0 0 10px}
.jp-legend{display:flex; gap:16px; margin-bottom:6px}
.lg{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-2)}
.lg i{width:11px; height:11px; border-radius:50%; display:inline-block}
.jp-mapwrap{background:linear-gradient(var(--card-2),#f6efe0); border:1px solid var(--line); border-radius:18px; padding:6px}
.journey-map{width:100%; height:auto; display:block}
.journey-map .jn-title{font-family:var(--serif); font-size:12px; fill:var(--ink)}
.journey-map .jn-sub{font-size:9px; fill:var(--ink-3); letter-spacing:.08em}
.journey-map .jnode{cursor:pointer}
.journey-map .jnode:hover circle:not(.pulse){filter:brightness(1.05)}
.journey-map .pulse{animation:pulse 2.4s ease-out infinite; opacity:.5}
@keyframes pulse{0%{r:16px; opacity:.55}100%{r:30px; opacity:0}}
.jp-detail{margin-top:14px; background:var(--card-2); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; font-size:14px; color:var(--ink-2); min-height:56px}
.jp-detail b{display:inline-block; font-family:var(--serif); font-size:16px}
.jd-status{margin-left:10px; font-size:12px; color:var(--ink-3)}
.jp-detail p{margin:6px 0 0; color:var(--ink-2)}

/* my year atlas */
.atlas-intro{font-size:14px; color:var(--ink-2); margin:0 0 14px}
.mo-rail{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px}
.mo{border:1px solid var(--line-2); background:var(--card-2); color:var(--ink-3);
  border-radius:999px; padding:5px 12px; font-size:12.5px; transition:.15s}
.mo.has{color:var(--ink); border-color:var(--gold-soft)}
.mo.on{background:var(--ink); color:#f7efdf; border-color:var(--ink)}
.mo:hover{transform:translateY(-1px)}
.atlas-list{display:flex; flex-direction:column; gap:12px}
.atlas-ev{display:flex; align-items:center; gap:14px; background:var(--card-2);
  border:1px solid var(--line); border-radius:14px; padding:13px 16px; position:relative}
.atlas-ev::after{content:""; position:absolute; left:74px; bottom:-12px; width:1px; height:12px; background:var(--line-2)}
.atlas-ev:last-child::after{display:none}
.ev-mo{font-family:var(--serif); font-size:13px; color:var(--gold); width:44px; flex:0 0 auto}
.ev-ic{font-size:24px}
.ev-body{display:flex; flex-direction:column}
.ev-body b{font-size:15px; color:var(--ink)}
.ev-body span{font-size:12.5px; color:var(--ink-3)}
.atlas-empty{color:var(--ink-3); font-style:italic; padding:14px}
.atlas-foot{margin-top:16px; text-align:center; font-size:12.5px; color:var(--ink-3)}
.atlas-foot b{font-family:var(--serif); color:var(--ink-2)}

/* decision lab */
.lab-panel{padding:6px 2px}
.lab-door{background:linear-gradient(var(--card-2),#f5eedd); border:1px solid var(--line);
  border-radius:18px; padding:26px 22px; text-align:center}
.lab-step{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold)}
.lab-q{font-size:26px; color:var(--ink); margin:10px 0 4px}
.lab-en{font-size:12px; letter-spacing:.1em; color:var(--ink-3); margin-bottom:16px}
.lab-input{width:100%; border:1px solid var(--line-2); border-radius:12px; background:var(--card);
  padding:12px 14px; font-family:var(--sans); font-size:15px; color:var(--ink); resize:vertical}
.lab-input:focus{outline:none; border-color:var(--gold-soft)}
.lab-nav{display:flex; justify-content:space-between; align-items:center; margin-top:16px}
.lab-back{background:none; border:none; color:var(--ink-3); font-size:14px}
.lab-next{background:var(--ink); color:#f7efdf; border:none; border-radius:999px; padding:10px 24px; font-size:15px}
.lab-next:hover{background:var(--gold)}
.lab-final{display:flex; gap:12px; justify-content:center; margin-top:8px}
.lab-yes{background:var(--sage); color:#fff; border:none; border-radius:999px; padding:12px 24px; font-size:15px}
.lab-not{background:var(--card); color:var(--ink-2); border:1px solid var(--line-2); border-radius:999px; padding:12px 24px; font-size:15px}
.lab-yes:hover{filter:brightness(1.05)} .lab-not:hover{border-color:var(--ink-3)}
.lab-result{text-align:center; padding:24px}
.lab-res-ic{font-size:42px}
.lab-result h3{font-size:24px; margin:8px 0}
.lab-result p{color:var(--ink-2); max-width:360px; margin:0 auto 16px}
.lab-recall{background:var(--card-2); border:1px solid var(--line); border-radius:12px; padding:12px 16px; font-size:14px; color:var(--ink)}
.lab-recall span{color:var(--ink-3)}
.lab-again{margin-top:16px; background:none; border:1px solid var(--line-2); border-radius:999px; padding:9px 20px; color:var(--ink-2)}
.lab-again:hover{border-color:var(--gold-soft); color:var(--ink)}

/* ---------------- parent mode ---------------- */

/* ============================================================
   NOYA Kids · Life Lab — Store
   ------------------------------------------------------------
   Tiny state container over localStorage.
   - Deep-merges saved data on top of SEED, so adding new fields
     or new children to data.js never breaks an existing save.
   - Any mutation goes through updateChild()/update(), which saves
     and then notifies subscribers (the app re-renders).
   ============================================================ */
(function (NOYA) {
  'use strict';

  const KEY = 'noya-kids-life-lab-v1';

  function deepMerge(base, over) {
    if (Array.isArray(base)) {
      // Arrays are treated as whole values: prefer the saved one if present.
      return over === undefined ? base : over;
    }
    if (base && typeof base === 'object') {
      const out = {};
      const keys = new Set([...Object.keys(base), ...Object.keys(over || {})]);
      keys.forEach((k) => {
        if (over && k in over && !(base[k] && typeof base[k] === 'object' && !Array.isArray(base[k]))) {
          out[k] = deepMerge(base[k] !== undefined ? base[k] : over[k], over[k]);
        } else if (base[k] && typeof base[k] === 'object') {
          out[k] = deepMerge(base[k], over ? over[k] || {} : {});
        } else {
          out[k] = over && k in over ? over[k] : base[k];
        }
      });
      return out;
    }
    return over === undefined ? base : over;
  }

  const Store = {
    state: null,
    subs: [],

    load() {
      let saved = null;
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) saved = JSON.parse(raw);
      } catch (e) { saved = null; }
      // Merge saved over a fresh clone of SEED.
      const fresh = JSON.parse(JSON.stringify(NOYA.SEED));
      this.state = saved ? deepMerge(fresh, saved) : fresh;
      return this.state;
    },

    save() {
      try { localStorage.setItem(KEY, JSON.stringify(this.state)); }
      catch (e) { /* storage full / disabled — prototype degrades gracefully */ }
    },

    reset() {
      try { localStorage.removeItem(KEY); } catch (e) {}
      this.load();
      this.emit();
    },

    subscribe(fn) { this.subs.push(fn); },
    emit() { this.subs.forEach((fn) => fn(this.state)); },

    /* --- accessors --- */
    child(id) { return this.state.children[id || this.state.currentChild]; },
    current() { return this.child(this.state.currentChild); },

    /* --- mutations (save + re-render) --- */
    update(fn) { fn(this.state); this.save(); this.emit(); },
    updateChild(id, fn) { fn(this.state.children[id]); this.save(); this.emit(); },

    setChild(id) { this.update((s) => { s.currentChild = id; }); },
    setParentMode(on) { this.update((s) => { s.parentMode = !!on; }); },
  };

  NOYA.Store = Store;
})(window.NOYA = window.NOYA || {});

/* ============================================================
   NOYA Kids · Life Lab — Views
   ------------------------------------------------------------
   Pure-ish render functions.  The world map, Today, Journey,

(function (NOYA) {

  const { Store, SVG } = NOYA;
  const V = {};

  /* ---------- tiny DOM helpers ---------- */
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const islandById = (id) => NOYA.ISLANDS.find((i) => i.id === id);

  let toastTimer = null;
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) { t = h('<div class="toast" role="status"></div>'); document.body.appendChild(t); }
    t.innerHTML = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }
  V.toast = toast;

  /* ---------- generic modal ---------- */
  function modal(titleHTML, bodyNode, cls) {
    const back = h(`<div class="modal-back"></div>`);
    const win = h(`<div class="modal ${cls || ''}"></div>`);
    const head = h(`<div class="modal-head"><div class="modal-title">${titleHTML}</div>
      <button class="modal-close" aria-label="关闭">✕</button></div>`);
    win.appendChild(head);
    const body = h(`<div class="modal-body"></div>`);
    body.appendChild(bodyNode);
    win.appendChild(body);
    back.appendChild(win);
    const close = () => { back.classList.remove('in'); setTimeout(() => back.remove(), 200); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    head.querySelector('.modal-close').addEventListener('click', close);
    back.addEventListener('click', (e) => { if (e.target === back) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
    requestAnimationFrame(() => back.classList.add('in'));
    return { back, win, body, close };
  }
  V.modal = modal;

  /* ============================================================
     TOP-LEVEL RENDER
     ============================================================ */
  V.render = function (state) {

    } else {
      const child = Store.current();
      app.setAttribute('data-theme', child.worldTheme);

      const c = Store.child(child.id);
      if (c.money.pools[from] < amt) { toast('可用的不够啦'); return false; }
      Store.updateChild(child.id, (cc) => { cc.money.pools[from] -= amt; cc.money.pools[to] += amt; });
      return true;
    }

    function wire() {
      // drag coins
      let dragVal = 0;
      body.querySelectorAll('.coin').forEach((coin) => {

      });

  V.openJourney = function () {
    const child = Store.current();
    const body = h(`<div class="journey-panel"></div>`);
    const st = child.semester.stages;
    const subjById = {}; child.semester.subjects.forEach((s) => subjById[s.id] = s);

    // winding path points across width
    const N = st.length;
    const W = 720, H = 300, padX = 60;
    const pts = st.map((s, i) => {
      const x = padX + (i / (N - 1)) * (W - padX * 2);
      const y = H / 2 + Math.sin(i * 1.15) * 78;
      return { x, y };
    });
    let path = `M${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const mx = (a.x + b.x) / 2;
      path += ` C ${mx} ${a.y}, ${mx} ${b.y}, ${b.x} ${b.y}`;
    }
    const doneIdx = st.map((s, i) => s.status === 'done' ? i : -1).filter((i) => i >= 0);
    const lastDone = doneIdx.length ? Math.max(...doneIdx) : 0;

    let nodes = '';
    st.forEach((s, i) => {
      const p = pts[i], sub = subjById[s.subject] || { color: '#b0946a', name: '' };
      const r = s.status === 'current' ? 16 : 13;
      nodes += `
        <g class="jnode st-${s.status}" data-jn="${i}" transform="translate(${p.x},${p.y})">
          <circle r="26" fill="transparent"/>
          ${s.status === 'current' ? `<circle r="24" class="pulse" fill="none" stroke="${sub.color}"/>` : ''}
          <circle r="${r}" fill="${s.status === 'locked' ? '#e7ddc9' : sub.color}"
                  stroke="#fff" stroke-width="3"/>
          ${s.status === 'done' ? `<path d="M-5 0 l3 4 l7 -8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
          ${s.status === 'current' ? `<circle r="4" fill="#fff"/>` : ''}
          <text y="${r + 16}" text-anchor="middle" class="jn-title">${esc(s.title)}</text>
          <text y="${r + 30}" text-anchor="middle" class="jn-sub">${esc(sub.name)}</text>
        </g>`;
    });
    // walker at last done node moving toward current
    const walker = pts[lastDone];

    const legend = child.semester.subjects.map((s) =>
      `<span class="lg"><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');

    body.innerHTML = `
      <p class="jp-intro">每完成一个阶段，就在地图上往前走一步。这学期的路，是这样的：</p>
      <div class="jp-legend">${legend}</div>
      <div class="jp-mapwrap">
        <svg viewBox="0 0 ${W} ${H + 30}" class="journey-map" preserveAspectRatio="xMidYMid meet">
          <path d="${path}" fill="none" stroke="#e3d8c1" stroke-width="10" stroke-linecap="round"/>
          <path d="${path}" fill="none" stroke="var(--isl,#c6a15b)" stroke-width="3.4"
                stroke-dasharray="3 8" stroke-linecap="round" opacity="0.55"/>
          ${nodes}
          <g transform="translate(${walker.x},${walker.y - 26})" class="walker">
            <text text-anchor="middle" font-size="20">🚶</text>
          </g>
        </svg>
      </div>
      <div class="jp-detail" id="jp-detail">点一个路标，看看那一关是什么。</div>`;

    const m = modal(`🗺️ 学期旅程 <span class="mt-en">Semester Journey</span>`, body, 'wide');

    const detail = body.querySelector('#jp-detail');
    body.querySelectorAll('.jnode').forEach((n) => {
      n.addEventListener('click', () => {
        const s = st[+n.getAttribute('data-jn')];
        const sub = subjById[s.subject];
        const label = { done: '已经走过 ✓', current: '正在这里 ★', locked: '还没解锁' }[s.status];
        detail.innerHTML = `<b style="color:${sub.color}">${esc(sub.name)} · ${esc(s.title)}</b>
          <span class="jd-status">${label}</span><p>${esc(s.note)}</p>`;
      });
    });
  };

  V.openYear = function () {

    const body = h(`<div class="year-panel"></div>`);

    function paint() {
      const evs = child.timeline.slice().sort((a, b) => a.month - b.month);
      const shown = filter ? evs.filter((e) => e.month === filter) : evs;
      const rail = months.map((mn, i) => {
        const has = evs.some((e) => e.month === i + 1);
        const on = filter === i + 1;
        return `<button class="mo ${has ? 'has' : ''} ${on ? 'on' : ''}" data-mo="${i + 1}">${mn}</button>`;
      }).join('');
      const cards = shown.length ? shown.map((e) => `
        <div class="atlas-ev">
          <div class="ev-mo">${months[e.month - 1]}</div>
          <div class="ev-ic">${e.icon}</div>

        b.addEventListener('click', () => { filter = +b.getAttribute('data-mo'); paint(); }));

  /* ============================================================
     DECISION LAB
     ============================================================ */
  V.openDecision = function () {
    const child = Store.current();
    const steps = NOYA.DECISION_STEPS;
    const answers = {};
    let i = 0;
    const body = h(`<div class="lab-panel"></div>`);

    function paint() {
      if (i < steps.length) {
        const s = steps[i];
        body.innerHTML = `
          <div class="lab-door">
            <div class="lab-step">第 ${i + 1} / ${steps.length} 道门</div>
            <h3 class="lab-q">${esc(s.q)}</h3>
            <div class="lab-en">${s.en}</div>
            ${s.key === 'still'
              ? `<div class="lab-final">
                   <button class="lab-yes" data-final="yes">YES · 我还想要</button>
                   <button class="lab-not" data-final="not">NOT NOW · 现在先不要</button>
                 </div>`
              : `<textarea class="lab-input" rows="3" placeholder="用自己的话写一写…">${esc(answers[s.key] || '')}</textarea>
                 <div class="lab-nav">
                   ${i > 0 ? `<button class="lab-back">← 上一道</button>` : `<span></span>`}
                   <button class="lab-next">下一道 →</button>
                 </div>`}
          </div>`;
        const ta = body.querySelector('.lab-input');
        if (ta) ta.addEventListener('input', () => answers[s.key] = ta.value);
        const nb = body.querySelector('.lab-next');
        if (nb) nb.addEventListener('click', () => { i++; paint(); });
        const bb = body.querySelector('.lab-back');
        if (bb) bb.addEventListener('click', () => { i--; paint(); });
        body.querySelectorAll('[data-final]').forEach((b) =>
          b.addEventListener('click', () => finish(b.getAttribute('data-final') === 'yes')));
      }
    }

    function finish(yes) {
      Store.updateChild(child.id, (c) => {
        c.decisions.unshift({ want: answers.want || '', result: yes ? 'yes' : 'not', day: c.day });
        if (c.decisions.length > 20) c.decisions.pop();
      });
      body.innerHTML = `
        <div class="lab-result ${yes ? 'yes' : 'not'}">
          <div class="lab-res-ic">${yes ? '🌟' : '🌙'}</div>
          <h3>${yes ? '你选择了：YES' : '你选择了：NOT NOW'}</h3>
          <p>${yes
            ? '你想清楚了，也知道要付出什么。这是你自己的选择。'
            : '现在先不要，不代表永远不要。你可以以后再回来。'}</p>
          <div class="lab-recall">
            <span>你想要的：</span>${esc(answers.want || '（没有写）')}
          </div>
          <button class="lab-again" data-action="open-decision">再走一次</button>
        </div>`;
    }

    paint();
    modal(`🔮 选择实验室 <span class="mt-en">Decision Lab</span>`, body, 'lab');
  };

      <button class="pm-save">保存财富账户</button>`;
    mForm.querySelector('.pm-save').addEventListener('click', () => {
      commit((c) => {
        mForm.querySelectorAll('.pm-in').forEach((inp) => c.money.pools[inp.getAttribute('data-pool')] = Math.max(0, +inp.value || 0));
        c.money.goalName = mForm.querySelector('.pm-goal').value.trim() || c.money.goalName;
        c.money.goalTarget = Math.max(1, +mForm.querySelector('.pm-target').value || 1);
      });
      V.toast('已保存 ✦');
    });
    money.appendChild(mForm);
    cols.appendChild(money);

    /* ---- Timeline ---- */
    const tl = section('成长事件', '记录真正经历过的时刻');
    const tlList = h(`<div class="p-list"></div>`);
    child.timeline.slice().sort((a,b)=>a.month-b.month).forEach((e) => {
      const idx = child.timeline.indexOf(e);
      const row = h(`<div class="p-row">
        <span class="p-mo">${e.month}月</span><span class="p-ic">${e.icon}</span>
        <span class="p-row-main"><b>${esc(e.title)}</b><i>${esc(e.note||'')}</i></span>
        <button class="p-del">✕</button></div>`);
      row.querySelector('.p-del').addEventListener('click', () => commit((c) => c.timeline.splice(idx, 1)));
      tlList.appendChild(row);
    });
    tl.appendChild(tlList);
    const moOpts = Array.from({length:12}, (_,i)=>`<option value="${i+1}">${i+1}月</option>`).join('');
    const tlForm = h(`<div class="p-form">
      <select class="pf-mo">${moOpts}</select>
      <input class="pf-ic" placeholder="🌟" value="🌟" maxlength="2" style="max-width:56px"/>
      <input class="pf-title" placeholder="事件"/>
      <input class="pf-note" placeholder="一句话（可选）"/>
      <button class="pf-add">＋ 添加</button></div>`);
    tlForm.querySelector('.pf-add').addEventListener('click', () => {
      const title = tlForm.querySelector('.pf-title').value.trim(); if (!title) return;
      commit((c) => c.timeline.push({ month: +tlForm.querySelector('.pf-mo').value,
        icon: tlForm.querySelector('.pf-ic').value || '🌟', title,
        note: tlForm.querySelector('.pf-note').value.trim() }));
    });
    tl.appendChild(tlForm);
    cols.appendChild(tl);

    wrap.appendChild(cols);

    /* wire the child-edit switch */
    ov.querySelectorAll('.ov-edit').forEach((b) =>
      b.addEventListener('click', () => { editId = b.getAttribute('data-edit'); Store.emit(); }));

    return wrap;
  };
})(window.NOYA = window.NOYA || {});

/* ============================================================
   NOYA Kids · Life Lab — App boot + event routing
   ------------------------------------------------------------
   One delegated click handler keeps the world screen wiring in
   one place; the overlays wire their own internal events.
   ============================================================ */
(function (NOYA) {
  'use strict';
  const { Store, V } = NOYA;

  const CHEERS = [
    '地图上前进了一步 ✦', '一颗星星亮了 ✦', '一小片区域被点亮了 ✧',
    '小树又长高了一点 🌱', '你的世界更完整了一点 ✦',
  ];
  const cheer = () => CHEERS[Math.floor(Date.now() / 900) % CHEERS.length];

  function pulseIsland(islandId) {
    const g = document.querySelector(`.isle[data-island="${islandId}"]`);
    if (!g) return;
    g.classList.remove('cheer'); void g.getBoundingClientRect();
    g.classList.add('cheer');
    setTimeout(() => g.classList.remove('cheer'), 900);
  }

  function handle(action, el) {
    const state = Store.state;
    switch (action) {
      case 'switch-child':
        Store.setChild(el.getAttribute('data-id'));
        break;
      case 'toggle-parent':
        Store.setParentMode(!state.parentMode);
        break;
      case 'open-island':
        V.openIsland(el.getAttribute('data-island'));
        break;
      case 'open-journey':  V.openJourney(); break;
      case 'open-year':     V.openYear(); break;
      case 'open-decision': V.openDecision(); break;

      case 'toggle-quest': {
        const id = el.getAttribute('data-id');
        const child = Store.current();
        const q = child.today.find((t) => t.id === id);
        const willComplete = !q.done;
        Store.updateChild(child.id, (c) => {
          const t = c.today.find((x) => x.id === id);
          t.done = !t.done;
          c.stars = Math.max(0, c.stars + (t.done ? 1 : -1));
        });
        if (willComplete) { pulseIsland(q.island); V.toast(cheer()); }
        break;
      }
      case 'toggle-baseline': {
        const i = +el.getAttribute('data-index');
        Store.updateChild(Store.current().id, (c) => { c.baseline[i].done = !c.baseline[i].done; });
        break;
      }
      case 'reset-data':
        if (confirm('重置为示例数据？两个孩子当前的数据都会清空。')) Store.reset();
        break;
    }
  }

  function onActivate(e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    if (e.type === 'keydown') {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
    }
    handle(el.getAttribute('data-action'), el);
  }

  document.addEventListener('click', onActivate);
  document.addEventListener('keydown', (e) => {
    // only route keyboard activation for the SVG island buttons / focusable roles
    if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('[data-action][tabindex]')) onActivate(e);
  });

  /* boot */
  Store.load();
  Store.subscribe(V.render);
  V.render(Store.state);
})(window.NOYA = window.NOYA || {});

  </script>
</body>
